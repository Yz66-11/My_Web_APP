<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 美食打卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F97316', 'primary-dark': '#EA580C', 'primary-light': '#FDBA74',
                        accent: '#FBBF24', 'accent-light': '#FDE68A',
                        'bg-warm': '#FFFAF5',
                        'warm-50': '#FFFAF5', 'warm-100': '#FFF3E0', 'warm-200': '#FFE0B2',
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="min-h-screen bg-warm relative overflow-hidden">
    <!-- Decorative blobs -->
    <div class="deco-blob w-72 h-72 bg-orange-300 -top-20 -left-20 animate-float"></div>
    <div class="deco-blob w-96 h-96 bg-amber-300 -bottom-32 -right-32 animate-float-alt"></div>
    <div class="deco-blob w-64 h-64 bg-rose-200 top-1/2 left-1/3 animate-float"></div>

    <!-- Food-themed decorative SVG pattern -->
    <svg class="absolute inset-0 w-full h-full opacity-[0.03] pointer-events-none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <pattern id="food-pattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
                <circle cx="40" cy="40" r="18" fill="none" stroke="#F97316" stroke-width="1.5"/>
                <circle cx="40" cy="40" r="8" fill="none" stroke="#F97316" stroke-width="1"/>
                <path d="M32 30 Q40 24 48 30" fill="none" stroke="#FBBF24" stroke-width="1"/>
                <path d="M30 40 Q24 40 30 34" fill="none" stroke="#FBBF24" stroke-width="1"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#food-pattern)"/>
    </svg>

    <!-- Content -->
    <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md animate-scale-in">
            <!-- Logo Area -->
            <div class="text-center mb-8 animate-fade-in-up">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-accent mb-4 shadow-lg shadow-orange-200/50">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold mb-2 gradient-text">美食打卡</h1>
                <p class="text-stone-500 text-sm">发现美食，分享体验</p>
            </div>

            <!-- Register Card -->
            <div class="glass-strong auth-card">
                <div class="p-8 pb-2">
                    <h2 class="text-2xl font-bold text-center text-stone-800 mb-1">创建账户</h2>
                    <p class="text-center text-stone-500 mb-6">加入美食打卡社区</p>
                </div>

                <div class="px-8 pb-8">
                    <!-- Thymeleaf backend error display -->
                    <div th:if="${error}" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl">
                        <p class="text-sm" th:text="${error}">错误消息</p>
                    </div>
                    <!-- Thymeleaf backend success display -->
                    <div th:if="${success}" class="mb-4 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl">
                        <p class="text-sm" th:text="${success}">成功消息</p>
                    </div>
                    <!-- JS URL-parameter error display (fallback) -->
                    <div style="display: none;" id="error-box" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl">
                        <p class="text-sm" id="error-text">错误消息</p>
                    </div>

                    <form action="/register" method="POST" class="space-y-4" id="registerForm">
                        <!-- Username Field -->
                        <div class="space-y-2">
                            <label for="username" class="text-sm font-medium text-stone-600">用户名</label>
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                                <input
                                        id="username"
                                        name="username"
                                        type="text"
                                        placeholder="请输入用户名"
                                        class="input-warm pl-10"
                                        th:value="${user != null ? user.username : ''}"
                                        required
                                />
                            </div>
                        </div>

                        <!-- Email Field -->
                        <div class="space-y-2">
                            <label for="email" class="text-sm font-medium text-stone-600">邮箱</label>
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                                </svg>
                                <input
                                        id="email"
                                        name="email"
                                        type="email"
                                        placeholder="请输入邮箱"
                                        class="input-warm pl-10"
                                        th:value="${user != null ? user.email : ''}"
                                        required
                                />
                                <p id="email-hint" class="text-xs mt-1 hidden"></p>
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div class="space-y-2">
                            <label for="password" class="text-sm font-medium text-stone-600">密码</label>
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                                <input
                                        id="password"
                                        name="password"
                                        type="password"
                                        placeholder="请输入密码"
                                        class="input-warm pl-10"
                                        required
                                />
                            </div>
                        </div>

                        <!-- Confirm Password Field -->
                        <div class="space-y-2">
                            <label for="confirmPassword" class="text-sm font-medium text-stone-600">确认密码</label>
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                                <input
                                        id="confirmPassword"
                                        name="confirmPassword"
                                        type="password"
                                        placeholder="请再次输入密码"
                                        class="input-warm pl-10"
                                        required
                                />
                                <p id="confirm-hint" class="text-xs mt-1 hidden"></p>
                            </div>
                        </div>

                        <!-- Terms Checkbox -->
                        <div class="flex items-start space-x-2">
                            <input
                                    type="checkbox"
                                    id="acceptTerms"
                                    name="acceptTerms"
                                    class="mt-1 h-4 w-4 text-primary focus:ring-primary border-stone-300 rounded"
                                    required
                            />
                            <label for="acceptTerms" class="text-sm text-stone-400">
                                我同意
                                <a href="#" class="text-primary hover:text-primary-dark underline">服务条款</a>
                                和
                                <a href="#" class="text-primary hover:text-primary-dark underline">隐私政策</a>
                            </label>
                        </div>

                        <!-- Register Button -->
                        <button
                                type="submit"
                                class="btn-primary w-full py-3 px-4 text-sm"
                        >
                            注册
                        </button>

                        <!-- Login Link -->
                        <div class="text-center pt-5 border-t border-stone-100">
                            <p class="text-stone-500 text-sm">
                                已有账户？
                                <a href="/login" class="text-primary hover:text-primary-dark font-medium transition-colors">
                                    立即登录
                                </a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Real-time form validation -->
    <script>
        (function () {
            const emailInput = document.getElementById('email');
            const emailHint = document.getElementById('email-hint');
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirmPassword');
            const confirmHint = document.getElementById('confirm-hint');
            const form = document.getElementById('registerForm');

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            function setHint(el, message, isError) {
                el.textContent = message;
                el.className = 'text-xs mt-1 ' + (isError ? 'text-red-500' : 'text-green-600');
                el.classList.remove('hidden');
            }
            function clearHint(el) {
                el.textContent = '';
                el.classList.add('hidden');
            }

            // --- Email real-time validation ---
            emailInput.addEventListener('input', function () {
                const val = this.value.trim();
                if (!val) { clearHint(emailHint); return; }
                if (emailRegex.test(val)) {
                    setHint(emailHint, '邮箱格式正确', false);
                    this.classList.remove('border-red-400');
                    this.classList.add('border-green-400');
                } else {
                    setHint(emailHint, '邮箱格式不正确', true);
                    this.classList.remove('border-green-400');
                    this.classList.add('border-red-400');
                }
            });

            // --- Confirm password real-time validation ---
            confirmInput.addEventListener('input', function () {
                const val = this.value;
                if (!val) { clearHint(confirmHint); this.classList.remove('border-red-400', 'border-green-400'); return; }
                if (val === passwordInput.value) {
                    setHint(confirmHint, '密码一致', false);
                    this.classList.remove('border-red-400');
                    this.classList.add('border-green-400');
                } else {
                    setHint(confirmHint, '两次输入的密码不一致', true);
                    this.classList.remove('border-green-400');
                    this.classList.add('border-red-400');
                }
            });

            // Also re-check confirm when password changes
            passwordInput.addEventListener('input', function () {
                const confirmVal = confirmInput.value;
                if (!confirmVal) return;
                if (confirmVal === this.value) {
                    setHint(confirmHint, '密码一致', false);
                    confirmInput.classList.remove('border-red-400');
                    confirmInput.classList.add('border-green-400');
                } else {
                    setHint(confirmHint, '两次输入的密码不一致', true);
                    confirmInput.classList.remove('border-green-400');
                    confirmInput.classList.add('border-red-400');
                }
            });

            // --- Block submit if passwords don't match ---
            form.addEventListener('submit', function (e) {
                if (passwordInput.value !== confirmInput.value) {
                    e.preventDefault();
                    setHint(confirmHint, '两次输入的密码不一致，请修正后再提交', true);
                    confirmInput.classList.remove('border-green-400');
                    confirmInput.classList.add('border-red-400');
                    confirmInput.focus();
                }
                if (emailInput.value.trim() && !emailRegex.test(emailInput.value.trim())) {
                    e.preventDefault();
                    setHint(emailHint, '请输入正确的邮箱格式', true);
                    emailInput.classList.remove('border-green-400');
                    emailInput.classList.add('border-red-400');
                    emailInput.focus();
                }
            });

            // Display URL-parameter messages (fallback when redirecting with ?error=)
            const urlParams = new URLSearchParams(window.location.search);
            const urlError = urlParams.get('error');
            if (urlError) {
                document.getElementById('error-box').style.display = 'block';
                document.getElementById('error-text').textContent = decodeURIComponent(urlError);
            }
        })();
    </script>
</body>
</html>
