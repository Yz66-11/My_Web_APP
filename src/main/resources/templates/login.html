<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 美食打卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED', 'primary-dark': '#5B21B6', 'primary-light': '#C4B5FD',
                        accent: '#818CF8', 'accent-light': '#BAE6FD',
                        'bg-warm': '#F8F7FF',
                        'warm-50': '#F8F7FF', 'warm-100': '#FFF3E0', 'warm-200': '#FFE0B2',
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="preload" href="/audio/1.m4a" as="audio">
    <script defer src="/js/app.js"></script>
    <script>
    // 尽早触发 1.m4a 的浏览器预缓冲，确保跨页面跳转后能瞬时播放
    (function() {
        var a = new Audio('/audio/1.m4a');
        a.preload = 'auto';
        a.load();
    })();
    </script>
</head>
<body class="min-h-screen bg-warm relative overflow-hidden">
    <!-- Decorative blobs -->
    <div class="deco-blob w-72 h-72 bg-orange-300 -top-20 -left-20 animate-float"></div>
    <div class="deco-blob w-96 h-96 bg-violet-300 -bottom-32 -right-32 animate-float-alt"></div>
    <div class="deco-blob w-64 h-64 bg-rose-200 top-1/2 left-1/3 animate-float"></div>

    <!-- Food-themed decorative SVG pattern -->
    <svg class="absolute inset-0 w-full h-full opacity-[0.03] pointer-events-none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <pattern id="food-pattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
                <circle cx="40" cy="40" r="18" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
                <circle cx="40" cy="40" r="8" fill="none" stroke="#7C3AED" stroke-width="1"/>
                <path d="M32 30 Q40 24 48 30" fill="none" stroke="#818CF8" stroke-width="1"/>
                <path d="M30 40 Q24 40 30 34" fill="none" stroke="#818CF8" stroke-width="1"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#food-pattern)"/>
    </svg>

    <!-- Content -->
    <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md animate-scale-in">
            <!-- Logo Area -->
            <div class="text-center mb-8 animate-fade-in-up">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-accent mb-4 shadow-lg shadow-violet-200/50">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 16.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold mb-2 gradient-text">美食打卡</h1>
                <p class="text-stone-500 text-sm">发现美食，分享体验</p>
            </div>

            <!-- Login Card -->
            <div class="glass-strong auth-card">
                <div class="p-8 pb-2">
                    <h2 class="text-2xl font-bold text-center text-stone-800 mb-1">欢迎回来</h2>
                    <p class="text-center text-stone-500 mb-6">登录您的美食打卡账户</p>
                </div>

                <div class="px-8 pb-8">
                    <!-- Error message display -->
                    <div th:if="${error}" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl">
                        <p class="text-sm" th:text="${error}">错误消息</p>
                    </div>

                    <!-- Success message display -->
                    <div th:if="${success}" class="mb-4 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl">
                        <p class="text-sm" th:text="${success}">成功消息</p>
                    </div>

                    <form action="/login" method="POST" class="space-y-5" onsubmit="sessionStorage.setItem('playLoginSound','true')">
                        <!-- Username Field -->
                        <div class="space-y-2">
                            <label for="username" class="text-sm font-medium text-stone-600">用户名</label>
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                                <input
                                        id="username"
                                        name="username"
                                        type="text"
                                        placeholder="请输入用户名"
                                        class="input-warm pl-10"
                                        required
                                />
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div class="space-y-2">
                            <label for="password" class="text-sm font-medium text-stone-600">密码</label>
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                                <input
                                        id="password"
                                        name="password"
                                        type="password"
                                        placeholder="请输入密码"
                                        class="input-warm pl-10"
                                        required
                                />
                            </div>
                        </div>

                        <!-- Forgot Password -->
                        <div class="flex items-center justify-end">
                            <a href="/forgot-password" class="text-primary hover:text-primary-dark text-sm font-medium transition-colors">
                                忘记密码？
                            </a>
                        </div>

                        <!-- Login Button -->
                        <button
                                type="submit"
                                class="btn-primary w-full py-3 px-4 text-sm btn-press"
                        >
                            登录
                        </button>

                        <!-- Register Link -->
                        <div class="text-center pt-5 border-t border-stone-100">
                            <p class="text-stone-500 text-sm">
                                还没有账户？
                                <a href="/register" class="text-primary hover:text-primary-dark font-medium transition-colors">
                                    立即注册
                                </a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
