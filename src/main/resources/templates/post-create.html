<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发帖 - 美食打卡</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/js/app.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#7C3AED', 'primary-dark': '#5B21B6', 'primary-light': '#C4B5FD', accent: '#818CF8', 'bg-warm': '#F8F7FF' }, fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] } }}
        }
    </script>
    <style>
        .image-preview-item { transition: all 0.2s ease; }
        .image-preview-item:hover .remove-btn { opacity: 1; }
        .pulse-dot { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    </style>
</head>
<body class="min-h-screen bg-warm">

<nav class="nav-glass sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4">
        <div class="flex justify-between items-center h-14">
            <a class="text-xl font-bold text-primary flex items-center gap-2" href="/">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 16.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                美食打卡
            </a>
            <a href="/posts" class="text-sm text-stone-400 hover:text-primary transition-colors flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                返回社区
            </a>
            <a href="/profile" class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center overflow-hidden ring-2 ring-white shadow-sm shrink-0 hover:ring-primary-light transition-all ml-auto" title="我的">
                <img th:if="${avatarUrl != null and !avatarUrl.isEmpty()}" th:src="${avatarUrl}" alt="头像" class="w-full h-full object-cover" referrerpolicy="no-referrer" />
                <span th:unless="${avatarUrl != null and !avatarUrl.isEmpty()}" class="text-white text-xs font-bold">
                    <span th:text="${username != null and !username.isEmpty() ? #strings.substring(username, 0, 1) : 'U'}">U</span>
                </span>
            </a>
        </div>
    </div>
</nav>

<div class="max-w-3xl mx-auto px-4 py-8">
    <div class="card-premium p-6 md:p-8 animate-fade-in-up dish-card">
        <div class="flex items-center gap-3 mb-2">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-violet-400 flex items-center justify-center">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            </div>
            <h1 class="text-xl font-bold text-stone-800">发布新帖子</h1>
        </div>
        <p class="text-xs text-stone-400 mb-6 ml-[52px]">帖子提交后需等待管理员审核通过才会公开展示</p>

        <form id="postForm" class="space-y-5">
            <!-- Title -->
            <div>
                <label class="block text-sm font-medium text-stone-600 mb-1.5">标题 <span class="text-red-500">*</span></label>
                <input type="text" id="post-title" required maxlength="200" placeholder="给你的帖子起个标题..."
                       class="input-warm"/>
            </div>

            <!-- Content -->
            <div>
                <label class="block text-sm font-medium text-stone-600 mb-1.5">内容 <span class="text-red-500">*</span></label>
                <textarea id="post-content" required rows="6" placeholder="分享你的美食体验，描述越详细越好..."
                          class="input-warm resize-y"></textarea>
            </div>

            <!-- Images: Upload -->
            <div>
                <label class="block text-sm font-medium text-stone-600 mb-2">照片</label>
                <div class="flex gap-2 flex-wrap">
                    <!-- Local file upload -->
                    <label class="btn-ghost px-4 py-2.5 text-sm cursor-pointer flex items-center gap-1.5 btn-press">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        本地上传
                        <input type="file" accept="image/*" multiple hidden
                               onchange="handleFileSelect(event)" />
                    </label>
                    <!-- Camera capture -->
                    <button type="button" onclick="openCamera()"
                            class="btn-ghost px-4 py-2.5 text-sm flex items-center gap-1.5 btn-press">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        拍照上传
                    </button>
                </div>
                <p class="text-xs text-stone-400 mt-1.5">支持多张照片，点击图片可删除</p>
                <!-- Image Preview Grid -->
                <div id="image-preview" class="flex gap-2 flex-wrap mt-3"></div>
            </div>

            <!-- Location: GPS -->
            <div>
                <label class="block text-sm font-medium text-stone-600 mb-1.5">地点</label>
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <input type="text" id="post-location" maxlength="200" autocomplete="off"
                               placeholder="请先点击右侧定位按钮自动获取，或手动输入"
                               class="input-warm w-full pr-10"/>
                        <span id="location-loading" class="absolute right-3 top-1/2 -translate-y-1/2 hidden">
                            <svg class="w-4 h-4 text-primary animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        </span>
                    </div>
                    <button type="button" onclick="getLocation()" id="locate-btn"
                            class="btn-ghost px-4 py-2.5 text-sm flex items-center gap-1.5 btn-press whitespace-nowrap">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        定位
                    </button>
                </div>
            </div>

            <!-- Submit -->
            <div class="flex gap-3 pt-2">
                <a href="/posts" class="btn-ghost flex-1 text-center py-2.5 text-sm btn-press">取消</a>
                <button type="submit" id="submit-btn"
                        class="btn-primary flex-1 py-2.5 text-sm btn-press flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    提交审核
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Camera Modal -->
<div id="camera-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4" style="background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden animate-scale-in">
        <div class="p-5">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-stone-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    拍照
                </h3>
                <button onclick="closeCamera()" class="w-8 h-8 rounded-full hover:bg-stone-100 flex items-center justify-center text-stone-400 hover:text-stone-600 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <video id="camera-preview" autoplay playsinline class="w-full rounded-xl bg-stone-900 mb-4"></video>
            <canvas id="camera-canvas" class="hidden"></canvas>
            <div id="camera-captured" class="hidden mb-4">
                <img id="camera-captured-img" alt="拍摄的照片" class="w-full rounded-xl">
            </div>
            <div class="flex justify-center gap-3">
                <button onclick="closeCamera()" class="btn-ghost px-6 py-2.5 text-sm">取消</button>
                <button onclick="capturePhoto()" id="capture-btn"
                        class="btn-primary px-6 py-2.5 text-sm flex items-center gap-1.5 btn-press">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    拍摄
                </button>
                <button onclick="confirmCameraPhoto()" id="confirm-btn"
                        class="btn-primary px-6 py-2.5 text-sm hidden items-center gap-1.5 btn-press">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    使用此照片
                </button>
                <button onclick="retakePhoto()" id="retake-btn"
                        class="btn-ghost px-6 py-2.5 text-sm hidden">重拍</button>
            </div>
        </div>
    </div>
</div>

<script>
// ==================== Image State ====================
const imageDataList = []; // { data: base64, name: string }

function handleFileSelect(e) {
    const files = e.target.files;
    if (!files || files.length === 0) return;
    for (let i = 0; i < files.length; i++) {
        readAndAddImage(files[i]);
    }
    e.target.value = ''; // reset so same file can be re-selected
}

// ==================== Camera (getUserMedia) ====================
let cameraStream = null;
let capturedPhotoData = null;

function openCamera() {
    const modal = document.getElementById('camera-modal');
    modal.classList.remove('hidden');
    document.getElementById('capture-btn').classList.remove('hidden');
    document.getElementById('confirm-btn').classList.add('hidden');
    document.getElementById('retake-btn').classList.add('hidden');
    document.getElementById('camera-captured').classList.add('hidden');
    document.getElementById('camera-preview').classList.remove('hidden');
    capturedPhotoData = null;
    startCamera();
}

function closeCamera() {
    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
    }
    document.getElementById('camera-modal').classList.add('hidden');
}

async function startCamera() {
    try {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
        }
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        });
        document.getElementById('camera-preview').srcObject = cameraStream;
    } catch (err) {
        // Fallback to front camera if rear is not available
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: true, audio: false
            });
            document.getElementById('camera-preview').srcObject = cameraStream;
        } catch (e) {
            showToast('error', '无法访问相机，请检查权限设置');
            closeCamera();
        }
    }
}

function capturePhoto() {
    const video = document.getElementById('camera-preview');
    const canvas = document.getElementById('camera-canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    capturedPhotoData = canvas.toDataURL('image/jpeg', 0.9);

    // Stop camera
    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
    }

    // Show captured preview
    document.getElementById('camera-captured-img').src = capturedPhotoData;
    document.getElementById('camera-captured').classList.remove('hidden');
    document.getElementById('camera-preview').classList.add('hidden');
    document.getElementById('capture-btn').classList.add('hidden');
    document.getElementById('confirm-btn').classList.remove('hidden');
    document.getElementById('retake-btn').classList.remove('hidden');
}

function retakePhoto() {
    capturedPhotoData = null;
    document.getElementById('camera-captured').classList.add('hidden');
    document.getElementById('camera-preview').classList.remove('hidden');
    document.getElementById('capture-btn').classList.remove('hidden');
    document.getElementById('confirm-btn').classList.add('hidden');
    document.getElementById('retake-btn').classList.add('hidden');
    startCamera();
}

function confirmCameraPhoto() {
    if (!capturedPhotoData) return;
    // Add to image list (same format as local files)
    imageDataList.push({ data: capturedPhotoData, name: 'camera_photo' });
    renderImagePreviews();
    closeCamera();
}

function readAndAddImage(file) {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        imageDataList.push({ data: ev.target.result, name: file.name || 'photo' });
        renderImagePreviews();
    };
    reader.readAsDataURL(file);
}

function renderImagePreviews() {
    const container = document.getElementById('image-preview');
    container.innerHTML = '';
    imageDataList.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'image-preview-item relative w-20 h-20 rounded-xl overflow-hidden bg-gradient-to-br from-indigo-50 to-violet-100 border border-violet-200/50 shadow-sm group cursor-pointer';
        div.innerHTML = '<img src="' + item.data + '" alt="照片" class="w-full h-full object-cover" />'
            + '<div class="remove-btn absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity rounded-xl" onclick="removeImage(' + index + ')">'
            + '<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>'
            + '</div>';
        container.appendChild(div);
    });
}

function removeImage(index) {
    imageDataList.splice(index, 1);
    renderImagePreviews();
}

// ==================== GPS Location (高德地图 API) ====================
function getLocation() {
    const btn = document.getElementById('locate-btn');
    const input = document.getElementById('post-location');
    const loading = document.getElementById('location-loading');

    if (!navigator.geolocation) {
        showToast('error', '浏览器不支持定位功能，请手动输入');
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> 定位中...';
    loading.classList.remove('hidden');

    navigator.geolocation.getCurrentPosition(
        function(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            // 高德地图逆地理编码
            fetch('https://restapi.amap.com/v3/geocode/regeo?key=a5c98b6acd681c5be08c4ae90ee5de2f&location=' + lng + ',' + lat)
                .then(r => r.json())
                .then(data => {
                    if (data.status === '1' && data.regeocode) {
                        const comp = data.regeocode.addressComponent;
                        const prov = comp.province || '';
                        const city = comp.city || prov;
                        const dist = comp.district || '';
                        const town = comp.township || '';
                        // street/streetNumber 在高德返回的是对象，取 .name 或 .street
                        const sNum = comp.streetNumber;
                        const streetName = (sNum && (sNum.street || sNum.name)) || '';
                        // 组装行政区地址
                        const parts = [prov, city !== prov ? city : '', dist, town, streetName].filter(Boolean);
                        input.value = parts.join('');
                        showToast('success', '已定位到：' + input.value);
                    } else {
                        // 高德失败时使用坐标
                        input.value = lat.toFixed(6) + ', ' + lng.toFixed(6);
                        showToast('error', '定位解析失败，地址已设置为坐标');
                    }
                    btn.disabled = false;
                    btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg> 重新定位';
                    loading.classList.add('hidden');
                })
                .catch(() => {
                    input.value = lat.toFixed(6) + ', ' + lng.toFixed(6);
                    showToast('error', '网络请求失败，地址已设置为坐标');
                    btn.disabled = false;
                    btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg> 重新定位';
                    loading.classList.add('hidden');
                });
        },
        function(err) {
            let msg = '定位失败';
            if (err.code === 1) msg = '定位权限被拒绝，请在浏览器设置中允许';
            else if (err.code === 2) msg = '无法获取位置信息';
            else if (err.code === 3) msg = '定位超时，请重试';
            showToast('error', msg);
            btn.disabled = false;
            btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg> 定位';
            loading.classList.add('hidden');
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
}

// ==================== Toast ====================
function showToast(type, message) {
    const existing = document.querySelector('.toast-custom');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast-custom fixed top-20 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-xl shadow-lg text-sm font-medium transition-all duration-300 animate-fade-in-up';
    if (type === 'error') {
        toast.className += ' bg-red-50 border border-red-200 text-red-700';
    } else {
        toast.className += ' bg-emerald-50 border border-emerald-200 text-emerald-700';
    }
    toast.innerHTML = message;
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
}

// ==================== Submit ====================
document.getElementById('postForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const title = document.getElementById('post-title').value.trim();
    const content = document.getElementById('post-content').value.trim();
    const location = document.getElementById('post-location').value.trim();

    if (!title) { showToast('error', '请输入标题'); return; }
    if (!content) { showToast('error', '请输入内容'); return; }

    // Disable button
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> 提交中...';

    try {
        const body = {
            title: title,
            content: content,
            location: location || null,
            images: imageDataList.map(item => item.data)
        };

        const resp = await fetch('/api/post/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        const result = await resp.json();
        if (result.success) {
            window.location.href = '/posts?success=1';
        } else {
            showToast('error', result.message || '提交失败');
            btn.disabled = false;
            btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> 提交审核';
        }
    } catch (err) {
        showToast('error', '网络错误，请稍后重试');
        btn.disabled = false;
        btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> 提交审核';
    }
});
</script>

</body>
</html>
