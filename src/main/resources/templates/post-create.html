<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发帖 - 美食打卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#ea580c', accent: '#f97316', muted: '#f5f5f5', 'muted-foreground': '#737373', border: '#e5e5e5' }}}
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Nav -->
<nav class="bg-white shadow-sm border-b border-border sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4">
        <div class="flex justify-between items-center h-14">
            <a class="text-xl font-bold text-primary" href="/">&#127869; 美食打卡</a>
            <a href="/posts" class="text-sm text-gray-500 hover:text-primary">&larr; 返回社区</a>
        </div>
    </div>
</nav>

<div class="max-w-3xl mx-auto px-4 py-8">
    <div class="bg-white rounded-xl shadow-sm border border-border p-6">
        <h1 class="text-xl font-bold text-gray-900 mb-2">&#9998; 发布新帖子</h1>
        <p class="text-xs text-gray-400 mb-6">帖子提交后需等待管理员审核通过才会公开展示</p>

        <form method="post" action="/post/create">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">标题</label>
                <input type="text" name="title" required maxlength="200" placeholder="给你的帖子起个标题..."
                       class="w-full px-4 py-2.5 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm"/>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">内容</label>
                <textarea name="content" required rows="8" placeholder="分享你的美食体验，描述越详细越好..."
                          class="w-full px-4 py-2.5 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm resize-y"></textarea>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">图片链接</label>
                <textarea name="imageUrls" rows="2" placeholder="粘贴图片链接，多张用逗号分隔（可选）"
                          class="w-full px-4 py-2.5 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm resize-y"></textarea>
                <p class="text-xs text-gray-400 mt-1">支持多张图片，URL 之间用英文逗号分隔</p>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">地点</label>
                <input type="text" name="location" maxlength="100" placeholder="分享你的就餐地点（可选）"
                       class="w-full px-4 py-2.5 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm"/>
            </div>

            <div class="flex gap-3">
                <a href="/posts" class="flex-1 text-center px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-sm font-medium transition-colors">
                    取消
                </a>
                <button type="submit" class="flex-1 px-4 py-2.5 bg-primary hover:bg-accent text-white rounded-lg text-sm font-medium transition-colors">
                    &#128228; 提交审核
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
