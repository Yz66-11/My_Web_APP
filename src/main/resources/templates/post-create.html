<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发帖 - 美食打卡</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/js/app.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#F97316', 'primary-dark': '#EA580C', 'primary-light': '#FDBA74', accent: '#FBBF24', 'bg-warm': '#FFFAF5' }, fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] } }}
        }
    </script>
</head>
<body class="min-h-screen bg-warm">

<nav class="nav-glass sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4">
        <div class="flex justify-between items-center h-14">
            <a class="text-xl font-bold text-primary flex items-center gap-2" href="/">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 16.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                美食打卡
            </a>
            <a href="/posts" class="text-sm text-stone-400 hover:text-primary transition-colors flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                返回社区
            </a>
        </div>
    </div>
</nav>

<div class="max-w-3xl mx-auto px-4 py-8">
    <div class="card-premium p-6 md:p-8 animate-fade-in-up dish-card">
        <div class="flex items-center gap-3 mb-2">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-amber-400 flex items-center justify-center">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            </div>
            <h1 class="text-xl font-bold text-stone-800">发布新帖子</h1>
        </div>
        <p class="text-xs text-stone-400 mb-6 ml-[52px]">帖子提交后需等待管理员审核通过才会公开展示</p>

        <form method="post" action="/post/create" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-stone-600 mb-1.5">标题</label>
                <input type="text" name="title" required maxlength="200" placeholder="给你的帖子起个标题..."
                       class="input-warm"/>
            </div>

            <div>
                <label class="block text-sm font-medium text-stone-600 mb-1.5">内容</label>
                <textarea name="content" required rows="8" placeholder="分享你的美食体验，描述越详细越好..."
                          class="input-warm resize-y"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-stone-600 mb-1.5">图片链接</label>
                <textarea name="imageUrls" rows="2" placeholder="粘贴图片链接，多张用逗号分隔（可选）"
                          class="input-warm resize-y"></textarea>
                <p class="text-xs text-stone-400 mt-1">支持多张图片，URL 之间用英文逗号分隔</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-stone-600 mb-1.5">地点</label>
                <input type="text" name="location" maxlength="100" placeholder="分享你的就餐地点（可选）"
                       class="input-warm"/>
            </div>

            <div class="flex gap-3 pt-2">
                <a href="/posts" class="btn-ghost flex-1 text-center py-2.5 text-sm btn-press">取消</a>
                <button type="submit" class="btn-primary flex-1 py-2.5 text-sm btn-press">提交审核</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
