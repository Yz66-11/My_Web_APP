<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食社区 - 美食打卡</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="preload" href="/audio/3.m4a" as="audio">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/js/app.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED', 'primary-dark': '#5B21B6', 'primary-light': '#C4B5FD',
                        accent: '#818CF8', 'accent-light': '#BAE6FD', 'bg-warm': '#F8F7FF',
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .post-card { transition: box-shadow 0.2s ease, transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.35s ease; }
        .post-card:hover { box-shadow: 0 4px 16px rgba(249, 115, 22, 0.08), 0 12px 32px rgba(28, 25, 23, 0.08); transform: translateY(-3px); border-color: var(--border-warm); }
    </style>
</head>
<body class="min-h-screen bg-bg-warm page-enter">

<!-- Nav -->
<nav class="nav-glass sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4">
        <div class="flex justify-between items-center h-14">
            <a class="flex items-center gap-2 text-xl font-bold text-primary-dark" href="/">
                <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C8.5 2 5 4 5 8c0 2.5 1.5 4 3 5.5V16a1 1 0 001 1h6a1 1 0 001-1v-2.5c1.5-1.5 3-3 3-5.5 0-4-3.5-6-7-6z" fill="url(#nav-grad)" opacity="0.9"/>
                    <path d="M9 18h6M9 20h4M10 22h2" stroke="#5B21B6" stroke-width="1.5" stroke-linecap="round"/>
                    <defs><linearGradient id="nav-grad" x1="5" y1="2" x2="19" y2="16"><stop stop-color="#C4B5FD"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs>
                </svg>
                <span>美食打卡</span>
            </a>
            <div class="flex items-center gap-4 text-sm">
                <a href="/" class="text-stone-400 hover:text-primary transition-colors">首页</a>
                <a href="/food-gallery" class="text-stone-400 hover:text-primary transition-colors">图鉴</a>
                <a href="/posts" class="text-primary font-semibold">社区</a>
                <a href="/profile" class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center overflow-hidden ring-2 ring-white shadow-sm shrink-0 hover:ring-primary-light transition-all" title="我的">
                    <img th:if="${avatarUrl != null and !avatarUrl.isEmpty()}" th:src="${avatarUrl}" alt="头像" class="w-full h-full object-cover" referrerpolicy="no-referrer" />
                    <span th:unless="${avatarUrl != null and !avatarUrl.isEmpty()}" class="text-white text-xs font-bold">
                        <span th:text="${username != null and !username.isEmpty() ? #strings.substring(username, 0, 1) : 'U'}">U</span>
                    </span>
                </a>
            </div>
        </div>
    </div>
</nav>

<div class="max-w-3xl mx-auto px-4 py-6">

    <!-- Flash Message -->
    <div th:if="${message}" class="mb-4 px-4 py-3 rounded-xl text-sm font-medium border"
         th:classappend="${messageType == 'success'} ? 'bg-green-50 text-green-700 border-green-200' : 'bg-red-50 text-red-700 border-red-200'"
         th:text="${message}">提示信息</div>

    <!-- Tab Bar + Search -->
    <div class="card-premium mb-6 p-4 dish-card">
        <div class="flex items-center gap-2 mb-3">
            <a th:href="@{/posts}" class="px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-200"
               th:classappend="${currentTab == 'latest'} ? 'bg-gradient-to-r from-primary to-primary-dark text-white shadow-sm' : 'bg-indigo-50 text-stone-500 hover:bg-violet-100'">
                最新
            </a>
            <a th:href="@{/posts(tab='favorites')}" class="px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-200"
               th:classappend="${currentTab == 'favorites'} ? 'bg-gradient-to-r from-primary to-primary-dark text-white shadow-sm' : 'bg-indigo-50 text-stone-500 hover:bg-violet-100'">
                收藏
            </a>
            <a th:href="@{/posts(tab='my')}" class="px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-200"
               th:classappend="${currentTab == 'my'} ? 'bg-gradient-to-r from-primary to-primary-dark text-white shadow-sm' : 'bg-indigo-50 text-stone-500 hover:bg-violet-100'">
                我的帖子
            </a>
            <a href="/post/create" class="btn-primary ml-auto px-4 py-1.5 text-sm inline-flex items-center gap-1 btn-press">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                发帖
            </a>
        </div>
        <form method="get" action="/posts" class="flex gap-2">
            <input type="text" name="keyword" placeholder="搜索帖子..."
                   th:value="${keyword}" class="input-warm flex-1"/>
            <button type="submit" class="bg-indigo-50 hover:bg-violet-100 text-stone-500 px-4 py-2 rounded-xl text-sm font-medium transition-colors">搜索</button>
        </form>
    </div>

    <!-- Post List - Empty State -->
    <div th:if="${#lists.isEmpty(posts)}" class="text-center py-16">
        <svg class="w-20 h-20 mx-auto mb-4 text-stone-300 animate-float" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
        </svg>
        <p class="text-stone-500 text-lg font-medium">暂无帖子</p>
        <a href="/post/create" class="inline-block mt-4 text-primary hover:text-primary-dark transition-colors text-sm font-medium">发布第一篇帖子</a>
    </div>

    <!-- Post Cards -->
    <div th:each="pv, iter : ${posts}" class="post-card card-premium mb-4 overflow-hidden animate-fade-in-up"
         th:style="${'animation-delay: ' + (iter.index * 0.06) + 's'}">
        <!-- Author -->
        <div class="flex items-center px-4 pt-4 pb-2">
            <div class="w-9 h-9 rounded-full bg-gradient-to-br from-violet-400 to-red-400 flex items-center justify-center overflow-hidden ring-2 ring-violet-100 shadow-sm shrink-0">
                <img th:if="${pv.authorAvatarUrl != null and !pv.authorAvatarUrl.isEmpty()}" th:src="${pv.authorAvatarUrl}" alt="" class="w-full h-full object-cover" referrerpolicy="no-referrer" />
                <span th:unless="${pv.authorAvatarUrl != null and !pv.authorAvatarUrl.isEmpty()}" class="text-white text-xs font-bold"
                      th:text="${#strings.defaultString(#strings.substring(pv.authorName, 0, 1), 'U')}">U</span>
            </div>
            <div class="ml-3">
                <span class="text-sm font-semibold text-stone-800" th:text="${pv.authorName != null ? pv.authorName : '用户'}">用户名</span>
                <span th:if="${pv.post.createdAt != null}" class="text-xs text-stone-400 ml-2" th:text="${#temporals.format(pv.post.createdAt, 'MM-dd HH:mm')}">时间</span>
            </div>
            <!-- Status badge for my posts -->
            <span th:if="${isMyPosts != null and isMyPosts and pv.post.status != null and pv.post.status.name() == 'PENDING'}" class="badge badge-warning ml-auto">待审核</span>
            <span th:if="${isMyPosts != null and isMyPosts and pv.post.status != null and pv.post.status.name() == 'REJECTED'}" class="badge badge-danger ml-auto">未通过</span>
        </div>

        <!-- Content -->
        <a th:href="@{/post/{id}(id=${pv.post.id})}" class="block px-4 pb-3">
            <h3 class="text-base font-bold text-stone-900 mb-1" th:text="${pv.post.title}">标题</h3>
            <p class="text-sm text-stone-500 leading-relaxed" th:text="${pv.previewContent}">内容预览</p>
        </a>

        <!-- Images -->
        <div th:if="${pv.imageList != null and !pv.imageList.isEmpty()}" class="px-4 pb-3">
            <div class="grid gap-2" th:classappend="${pv.imageList.size() == 1} ? 'grid-cols-1' : (${pv.imageList.size() == 2 || pv.imageList.size() == 4} ? 'grid-cols-2' : 'grid-cols-3')">
                <div th:each="img : ${pv.imageList}" class="aspect-square bg-gradient-to-br from-indigo-50 to-violet-100 rounded-xl overflow-hidden">
                    <img th:src="${img}" alt="帖子图片" class="w-full h-full object-cover" loading="lazy" referrerpolicy="no-referrer" />
                </div>
            </div>
        </div>

        <!-- Location -->
        <div th:if="${pv.post.location != null and !pv.post.location.isEmpty()}" class="px-4 pb-2">
            <span class="text-xs text-stone-400 inline-flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/></svg>
                <span th:text="${pv.post.location}">地点</span>
            </span>
        </div>

        <!-- Actions -->
        <div class="flex items-center border-t border-stone-100 px-4 py-2.5 text-sm text-stone-500">
            <form method="post" th:action="@{/post/{id}/like(id=${pv.post.id})}" class="flex items-center gap-1 cursor-pointer transition-colors" th:data-post-id="${pv.post.id}" onsubmit="return likePost(this, event, '/audio/3.m4a')">
                <input type="hidden" name="from" value="/posts"/>
                <button type="submit" class="flex items-center gap-1 active:scale-90 transition-transform"
                        th:classappend="${pv.liked} ? 'text-red-500' : 'hover:text-red-500'">
                    <svg th:classappend="${pv.liked} ? '' : 'hidden'" class="w-5 h-5" fill="#ef4444" viewBox="0 0 24 24"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"/></svg>
                    <svg th:classappend="${pv.liked} ? 'hidden' : ''" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
                    <span th:text="${pv.post.likeCount}">0</span>
                </button>
            </form>
            <a th:href="@{/post/{id}(id=${pv.post.id})}" class="flex items-center gap-1 ml-6 hover:text-primary transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.444 3 12c0 2.104.859 4.023 2.273 5.48.432.447.74 1.04.586 1.641a4.483 4.483 0 01-.923 1.785A5.969 5.969 0 006 21c1.282 0 2.47-.402 3.445-1.087.81.22 1.668.337 2.555.337z"/></svg>
                <span th:text="${pv.post.commentCount}">0</span>
            </a>
            <form method="post" th:action="@{/post/{id}/favorite(id=${pv.post.id})}" class="flex items-center gap-1 ml-6 cursor-pointer transition-colors" onsubmit="return favoritePost(this, event)">
                <input type="hidden" name="from" value="/posts"/>
                <button type="submit" class="flex items-center gap-1 active:scale-90 transition-transform"
                        th:classappend="${pv.favorited} ? 'text-indigo-500' : 'hover:text-indigo-500'">
                    <svg th:if="${pv.favorited}" class="w-5 h-5" fill="#eab308" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z" clip-rule="evenodd"/></svg>
                    <svg th:unless="${pv.favorited}" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg>
                    <span th:text="${pv.post.favoriteCount}">0</span>
                </button>
            </form>
            <button type="button" th:attr="onclick='sharePost(' + ${pv.post.id} + ')'"
                    class="flex items-center gap-1 ml-6 hover:text-primary transition-colors active:scale-90">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z"/></svg>
                <span th:text="${pv.post.shareCount}">0</span>
            </button>
        </div>
    </div>

    <!-- Pagination -->
    <div th:if="${totalPages != null and totalPages > 1}" class="flex justify-center gap-2 mt-6">
        <a th:href="@{/posts(page=${currentPage - 1}, keyword=${keyword != null ? keyword : ''})}"
           th:classappend="${!hasPrev} ? 'pointer-events-none opacity-40' : ''"
           class="px-5 py-2 bg-white border border-stone-200 rounded-full text-sm hover:bg-indigo-50 hover:border-violet-200 transition-all">&laquo; 上一页</a>
        <span class="px-5 py-2 text-sm text-stone-400" th:text="${currentPage + 1} + '/' + ${totalPages}">1/1</span>
        <a th:href="@{/posts(page=${currentPage + 1}, keyword=${keyword != null ? keyword : ''})}"
           th:classappend="${!hasNext} ? 'pointer-events-none opacity-40' : ''"
           class="px-5 py-2 bg-white border border-stone-200 rounded-full text-sm hover:bg-indigo-50 hover:border-violet-200 transition-all">下一页 &raquo;</a>
    </div>
</div>

<script>
/** 点赞：AJAX 提交，播放音效，动态更新 UI（不刷新页面） */
function likePost(form, event, src) {
    event.preventDefault();
    SoundManager.play(src);
    var formData = new FormData(form);
    fetch(form.action, { method: 'POST', body: new URLSearchParams(formData) })
        .then(function(resp) {
            if (!resp.ok) { window.location.reload(); return; }
            var btn = form.querySelector('button');
            var countEl = btn.querySelector('span:last-child');
            var heartFilled = btn.querySelector('svg[fill="#ef4444"]');
            var heartOutline = btn.querySelector('svg[fill="none"]');
            var count = parseInt(countEl.textContent) || 0;
            var liked = btn.classList.contains('text-red-500');
            if (liked) {
                btn.classList.remove('text-red-500');
                countEl.textContent = Math.max(0, count - 1);
                if (heartFilled) heartFilled.classList.add('hidden');
                if (heartOutline) heartOutline.classList.remove('hidden');
            } else {
                btn.classList.add('text-red-500');
                countEl.textContent = count + 1;
                if (heartFilled) heartFilled.classList.remove('hidden');
                if (heartOutline) heartOutline.classList.add('hidden');
            }
        })
        .catch(function() { window.location.reload(); });
    return false;
}

/** 收藏：AJAX 提交，动态更新 UI（不刷新页面） */
function favoritePost(form, event) {
    event.preventDefault();
    var formData = new FormData(form);
    fetch(form.action, { method: 'POST', body: new URLSearchParams(formData) })
        .then(function(resp) {
            if (!resp.ok) { window.location.reload(); return; }
            var btn = form.querySelector('button');
            var countEl = btn.querySelector('span:last-child');
            var starFilled = btn.querySelector('svg[fill="#eab308"]');
            var starOutline = btn.querySelector('svg[fill="none"]');
            var count = parseInt(countEl.textContent) || 0;
            var favorited = btn.classList.contains('text-indigo-500');
            if (favorited) {
                btn.classList.remove('text-indigo-500');
                countEl.textContent = Math.max(0, count - 1);
                if (starFilled) starFilled.classList.add('hidden');
                if (starOutline) starOutline.classList.remove('hidden');
            } else {
                btn.classList.add('text-indigo-500');
                countEl.textContent = count + 1;
                if (starFilled) starFilled.classList.remove('hidden');
                if (starOutline) starOutline.classList.add('hidden');
            }
        })
        .catch(function() { window.location.reload(); });
    return false;
}

/** 分享：异步增加计数，不刷新页面 */
function sharePost(postId) {
    var shareUrl = '/post/' + postId;
    fetch('/post/' + postId + '/share', { method: 'POST' })
        .then(function() {
            // 动态更新分享计数
            var cards = document.querySelectorAll('[data-post-id="' + postId + '"]');
            // 找不到就用 location reload 兜底
            if (cards.length === 0) return;
        })
        .catch(function() {});
    if (navigator.share) {
        navigator.share({ title: '美食打卡', url: shareUrl }).catch(function(){});
    } else {
        navigator.clipboard.writeText(window.location.origin + shareUrl)
            .then(function() { alert('链接已复制到剪贴板'); })
            .catch(function(){});
    }
}
</script>

<!-- 浮动宠物陪伴 -->
<div th:replace="~{fragments/pet-sidebar :: pet-sidebar}"></div>
</body>
</html>
