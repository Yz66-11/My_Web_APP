<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食社区 - 美食打卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#ea580c', accent: '#f97316', muted: '#f5f5f5', 'muted-foreground': '#737373', border: '#e5e5e5' }}}
        }
    </script>
    <style>
        .post-card { transition: box-shadow 0.2s ease; }
        .post-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Nav -->
<nav class="bg-white shadow-sm border-b border-border sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4">
        <div class="flex justify-between items-center h-14">
            <a class="text-xl font-bold text-primary" href="/">&#127869; 美食打卡</a>
            <div class="flex items-center gap-4 text-sm">
                <a href="/" class="text-gray-500 hover:text-primary">首页</a>
                <a href="/food-gallery" class="text-gray-500 hover:text-primary">图鉴</a>
                <a href="/posts" class="text-primary font-semibold">社区</a>
                <a href="/profile" class="text-gray-500 hover:text-primary">我的</a>
            </div>
        </div>
    </div>
</nav>

<div class="max-w-3xl mx-auto px-4 py-6">

    <!-- Flash Message -->
    <div th:if="${message}" class="mb-4 px-4 py-3 rounded-xl text-sm font-medium border"
         th:classappend="${messageType == 'success'} ? 'bg-green-50 text-green-700 border-green-200' : 'bg-red-50 text-red-700 border-red-200'"
         th:text="${message}">提示信息</div>

    <!-- Tab Bar + Search -->
    <div class="bg-white rounded-xl shadow-sm border border-border mb-6 p-4">
        <div class="flex items-center gap-2 mb-3">
            <a th:href="@{/posts}" class="px-4 py-1.5 rounded-full text-sm font-medium"
               th:classappend="${currentTab == 'latest'} ? 'bg-primary text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'">
                最新
            </a>
            <a th:href="@{/posts(tab='favorites')}" class="px-4 py-1.5 rounded-full text-sm font-medium"
               th:classappend="${currentTab == 'favorites'} ? 'bg-primary text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'">
                &#11088; 收藏
            </a>
            <a th:href="@{/posts(tab='my')}" class="px-4 py-1.5 rounded-full text-sm font-medium"
               th:classappend="${currentTab == 'my'} ? 'bg-primary text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'">
                &#128221; 我的帖子
            </a>
            <a href="/post/create" class="ml-auto bg-primary hover:bg-accent text-white px-4 py-1.5 rounded-full text-sm font-medium">
                + 发帖
            </a>
        </div>
        <form method="get" action="/posts" class="flex gap-2">
            <input type="text" name="keyword" placeholder="搜索帖子..."
                   th:value="${keyword}" class="flex-1 px-3 py-2 border border-border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary"/>
            <button type="submit" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 py-2 rounded-lg text-sm">搜索</button>
        </form>
    </div>

    <!-- Post List -->
    <div th:if="${#lists.isEmpty(posts)}" class="text-center py-16">
        <div class="text-5xl mb-4">&#128196;</div>
        <p class="text-gray-400 text-lg">暂无帖子</p>
        <a href="/post/create" class="inline-block mt-4 text-primary hover:underline text-sm">发布第一篇帖子</a>
    </div>

    <div th:each="pv : ${posts}" class="post-card bg-white rounded-xl shadow-sm border border-border mb-4 overflow-hidden">
        <!-- Author -->
        <div class="flex items-center px-4 pt-4 pb-2">
            <div class="w-9 h-9 bg-gradient-to-br from-orange-400 to-red-400 rounded-full flex items-center justify-center text-white font-bold text-sm"
                 th:text="${pv.authorName.charAt(0)}">U</div>
            <div class="ml-3">
                <span class="text-sm font-semibold text-gray-800" th:text="${pv.authorName}">用户名</span>
                <span class="text-xs text-gray-400 ml-2" th:text="${#temporals.format(pv.post.createdAt, 'MM-dd HH:mm')}">时间</span>
            </div>
            <!-- Status badge for my posts -->
            <span th:if="${isMyPosts and pv.post.status != null and pv.post.status.name() == 'PENDING'}" class="ml-auto text-xs bg-yellow-100 text-yellow-700 px-2.5 py-1 rounded-full font-medium">待审核</span>
            <span th:if="${isMyPosts and pv.post.status != null and pv.post.status.name() == 'REJECTED'}" class="ml-auto text-xs bg-red-100 text-red-600 px-2.5 py-1 rounded-full font-medium">未通过</span>
        </div>

        <!-- Content -->
        <a th:href="@{/post/{id}(id=${pv.post.id})}" class="block px-4 pb-3">
            <h3 class="text-base font-bold text-gray-900 mb-1" th:text="${pv.post.title}">标题</h3>
            <p class="text-sm text-gray-600 leading-relaxed" th:text="${pv.previewContent}">内容预览</p>
        </a>

        <!-- Images -->
        <div th:if="${!#lists.isEmpty(pv.imageList)}" class="px-4 pb-3">
            <div class="grid gap-2" th:classappend="${pv.imageList.size() == 1} ? 'grid-cols-1' : (${pv.imageList.size() == 2 || pv.imageList.size() == 4} ? 'grid-cols-2' : 'grid-cols-3')">
                <div th:each="img : ${pv.imageList}" class="aspect-square bg-gradient-to-br from-orange-50 to-orange-100 rounded-lg flex items-center justify-center overflow-hidden">
                    <span class="text-4xl opacity-60">&#128247;</span>
                </div>
            </div>
        </div>

        <!-- Location -->
        <div th:if="${pv.post.location}" class="px-4 pb-2">
            <span class="text-xs text-gray-400">&#128205; <span th:text="${pv.post.location}">地点</span></span>
        </div>

        <!-- Actions -->
        <div class="flex items-center border-t border-border px-4 py-2.5 text-sm text-gray-500">
            <form method="post" th:action="@{/post/{id}/like(id=${pv.post.id})}" class="flex items-center gap-1 cursor-pointer hover:text-red-500 transition-colors">
                <input type="hidden" name="from" value="/posts"/>
                <button type="submit" class="flex items-center gap-1">
                    <span th:text="${pv.liked} ? '&#10084;' : '&#9825;'" th:style="${pv.liked} ? 'color:#ef4444' : ''">&#9825;</span>
                    <span th:text="${pv.post.likeCount}">0</span>
                </button>
            </form>
            <a th:href="@{/post/{id}(id=${pv.post.id})}" class="flex items-center gap-1 ml-6 hover:text-primary transition-colors">
                <span>&#128172;</span>
                <span th:text="${pv.post.commentCount}">0</span>
            </a>
            <form method="post" th:action="@{/post/{id}/favorite(id=${pv.post.id})}" class="flex items-center gap-1 ml-6 cursor-pointer hover:text-yellow-500 transition-colors">
                <input type="hidden" name="from" value="/posts"/>
                <button type="submit" class="flex items-center gap-1">
                    <span th:text="${pv.favorited} ? '&#11088;' : '&#9734;'" th:style="${pv.favorited} ? 'color:#eab308' : ''">&#9734;</span>
                    <span th:text="${pv.post.favoriteCount}">0</span>
                </button>
            </form>
            <button type="button" th:attr="onclick='sharePost(' + ${pv.post.id} + ')'"
                    class="flex items-center gap-1 ml-6 hover:text-primary transition-colors">
                <span>&#128228;</span>
                <span th:text="${pv.post.shareCount}">0</span>
            </button>
        </div>
    </div>

    <!-- Pagination -->
    <div th:if="${totalPages != null and totalPages > 1}" class="flex justify-center gap-2 mt-6">
        <a th:href="@{/posts(page=${currentPage - 1}, keyword=${keyword})}"
           th:classappend="${!hasPrev} ? 'pointer-events-none opacity-40' : ''"
           class="px-4 py-2 bg-white border border-border rounded-lg text-sm hover:bg-gray-50">&laquo; 上一页</a>
        <span class="px-4 py-2 text-sm text-gray-500" th:text="${currentPage + 1} + '/' + ${totalPages}">1/1</span>
        <a th:href="@{/posts(page=${currentPage + 1}, keyword=${keyword})}"
           th:classappend="${!hasNext} ? 'pointer-events-none opacity-40' : ''"
           class="px-4 py-2 bg-white border border-border rounded-lg text-sm hover:bg-gray-50">下一页 &raquo;</a>
    </div>
</div>

<script>
function sharePost(postId) {
    fetch('/post/' + postId + '/share', { method: 'POST' })
        .then(() => {
            if (navigator.share) {
                navigator.share({ title: '美食打卡', url: '/post/' + postId }).catch(() => {});
            }
            location.reload();
        });
}
</script>
</body>
</html>
