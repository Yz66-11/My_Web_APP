<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食打卡 - 美食打卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F97316', 'primary-dark': '#EA580C', 'primary-light': '#FDBA74',
                        accent: '#FBBF24', 'accent-light': '#FDE68A', 'bg-warm': '#FFFAF5',
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        #camera-preview {
            max-width: 100%;
            border-radius: 1rem;
        }
        #captured-image {
            max-width: 100%;
            border-radius: 1rem;
        }
    </style>
</head>
<body class="min-h-screen bg-bg-warm font-sans">

<!-- Navigation -->
<nav class="nav-glass sticky top-0 z-50">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center h-16">
            <a class="text-xl font-bold text-primary flex items-center gap-2" href="/">
                <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
                    <path d="M7 2v20"/>
                    <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
                </svg>
                <span class="gradient-text font-black">美食打卡</span>
            </a>
            <div class="flex items-center gap-6 text-sm">
                <a href="/" class="text-stone-500 hover:text-primary transition-colors">首页</a>
                <a href="/merchants" class="text-stone-500 hover:text-primary transition-colors">商家</a>
                <a href="/food-gallery" class="text-stone-500 hover:text-primary transition-colors">图鉴</a>
                <a href="/checkin" class="text-primary font-semibold">打卡</a>
                <a href="/profile" class="text-stone-500 hover:text-primary transition-colors">我的</a>
            </div>
        </div>
    </div>
</nav>

<!-- Page Header -->
<div class="hero-gradient text-white py-12">
    <div class="container mx-auto px-4">
        <h1 class="text-4xl font-black mb-2">美食打卡</h1>
        <p class="text-lg text-white/85">拍照记录美食瞬间，解锁图鉴</p>
    </div>
</div>

<!-- Check-in Content -->
<div class="container mx-auto px-4 py-12">
    <div class="max-w-3xl mx-auto">
        <!-- Location Info -->
        <div class="card-premium p-6 mb-6 animate-fade-in-up">
            <h2 class="text-xl font-bold text-stone-800 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                当前位置
            </h2>
            <div id="location-status" class="space-y-3">
                <p class="text-stone-500">正在获取位置信息...</p>
                <button onclick="getLocation()" class="btn-primary px-5 py-2 text-sm">
                    重新定位
                </button>
            </div>
            <div id="location-info" class="hidden space-y-2">
                <p class="text-stone-700">
                    <span class="font-semibold">地址：</span>
                    <span id="address">正在解析...</span>
                </p>
                <p class="text-stone-400 text-sm">
                    <span>经度：</span><span id="longitude">-</span>
                    <span class="ml-4">纬度：</span><span id="latitude">-</span>
                </p>
            </div>
        </div>

        <!-- Camera Section -->
        <div class="card-premium p-6 mb-6 animate-fade-in-up stagger-1">
            <h2 class="text-xl font-bold text-stone-800 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                拍摄美食照片
            </h2>

            <!-- Camera Preview -->
            <div id="camera-section" class="text-center">
                <video id="camera-preview" autoplay playsinline class="mb-4 mx-auto bg-stone-900 rounded-xl"></video>
                <div class="flex justify-center gap-3">
                    <button onclick="startCamera()" class="btn-ghost px-6 py-3 font-semibold flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        打开相机
                    </button>
                    <button onclick="capturePhoto()" id="capture-btn" class="btn-primary px-6 py-3 font-semibold hidden flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        拍照
                    </button>
                </div>
            </div>

            <!-- Captured Image -->
            <div id="image-section" class="hidden text-center">
                <img id="captured-image" alt="Captured food" class="mb-4 mx-auto">
                <canvas id="canvas" class="hidden"></canvas>
                <div class="flex justify-center gap-3">
                    <button onclick="retakePhoto()" class="btn-ghost px-6 py-3 font-semibold flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        重拍
                    </button>
                    <button onclick="submitCheckin()" class="btn-primary px-6 py-3 font-semibold flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                        确认打卡
                    </button>
                </div>
            </div>
        </div>

        <!-- Food Selection -->
        <div class="card-premium p-6 animate-fade-in-up stagger-2">
            <h2 class="text-xl font-bold text-stone-800 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                选择美食类型
            </h2>
            <select id="food-type" class="input-warm">
                <option value="">请选择美食类型</option>
                <option value="ramen">拉面 🍜</option>
                <option value="pizza">披萨 🍕</option>
                <option value="sushi">寿司 🍣</option>
                <option value="burger">汉堡 🍔</option>
                <option value="salad">沙拉 🥗</option>
                <option value="coffee">咖啡 ☕</option>
                <option value="dessert">甜点 🍰</option>
                <option value="other">其他</option>
            </select>

            <textarea id="comment" placeholder="分享你的美食体验..." class="input-warm mt-4 resize-none" rows="4"></textarea>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="border-t border-stone-200/60 py-8 mt-12 bg-white/50">
    <div class="container mx-auto px-4 text-center text-sm text-stone-400">
        &copy; 2026 美食打卡点评系统
    </div>
</footer>

<script>
    let stream = null;
    let locationData = null;

    function getLocation() {
        if (navigator.geolocation) {
            document.getElementById('location-status').innerHTML = '<p class="text-stone-500">正在获取位置信息...</p>';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    locationData = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude
                    };

                    document.getElementById('longitude').textContent = locationData.longitude.toFixed(6);
                    document.getElementById('latitude').textContent = locationData.latitude.toFixed(6);
                    document.getElementById('address').textContent = '位置获取成功';

                    document.getElementById('location-status').classList.add('hidden');
                    document.getElementById('location-info').classList.remove('hidden');
                },
                (error) => {
                    document.getElementById('location-status').innerHTML =
                        '<p class="text-red-500">位置获取失败，请检查权限设置</p>' +
                        '<button onclick="getLocation()" class="btn-primary mt-2 px-5 py-2 text-sm">重新定位</button>';
                }
            );
        } else {
            alert('您的浏览器不支持地理定位');
        }
    }

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' },
                audio: false
            });

            const video = document.getElementById('camera-preview');
            video.srcObject = stream;
            document.getElementById('capture-btn').classList.remove('hidden');
        } catch (error) {
            alert('无法访问相机，请检查权限设置');
            console.error('Camera error:', error);
        }
    }

    function capturePhoto() {
        const video = document.getElementById('camera-preview');
        const canvas = document.getElementById('canvas');
        const image = document.getElementById('captured-image');

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0);

        const imageData = canvas.toDataURL('image/jpeg');
        image.src = imageData;

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }

        document.getElementById('camera-section').classList.add('hidden');
        document.getElementById('image-section').classList.remove('hidden');
    }

    function retakePhoto() {
        document.getElementById('camera-section').classList.remove('hidden');
        document.getElementById('image-section').classList.add('hidden');
        startCamera();
    }

    async function submitCheckin() {
        const foodType = document.getElementById('food-type').value;
        const comment = document.getElementById('comment').value;
        const image = document.getElementById('captured-image').src;

        if (!foodType) {
            alert('请选择美食类型');
            return;
        }

        if (!locationData) {
            alert('请先获取位置信息');
            return;
        }

        if (!image || image === '') {
            alert('请先拍摄照片');
            return;
        }

        const checkinData = {
            foodType: foodType,
            comment: comment,
            image: image,
            location: locationData,
            timestamp: new Date().toISOString()
        };

        console.log('Check-in data:', checkinData);

        alert('打卡成功！图鉴已更新');
        window.location.href = '/food-gallery';
    }

    window.onload = function() {
        getLocation();
    };
</script>
</body>
</html>
