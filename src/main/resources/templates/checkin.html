<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>美食打卡 - 美食评价系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #camera-preview {
            max-width: 100%;
            border-radius: 1rem;
        }
        #captured-image {
            max-width: 100%;
            border-radius: 1rem;
        }
        .location-info {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gray-50">
<!-- Navigation -->
<nav class="bg-white shadow-lg border-b-4 border-orange-500">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-4">
            <a class="text-2xl font-bold text-orange-600 flex items-center" href="/">
                🍽️ 美食评价系统
            </a>
            <div class="flex items-center space-x-4">
                <a href="/" class="text-gray-600 hover:text-orange-600 transition-colors">首页</a>
                <a href="/merchants" class="text-gray-600 hover:text-orange-600 transition-colors">商家列表</a>
                <a href="/food-gallery" class="text-gray-600 hover:text-orange-600 transition-colors">美食图鉴</a>
            </div>
        </div>
    </div>
</nav>

<!-- Page Header -->
<div class="bg-gradient-to-r from-orange-500 to-red-500 text-white py-12">
    <div class="container mx-auto px-4">
        <h1 class="text-4xl font-bold mb-2">美食打卡</h1>
        <p class="text-lg opacity-90">拍照记录美食瞬间，解锁图鉴</p>
    </div>
</div>

<!-- Check-in Content -->
<div class="container mx-auto px-4 py-12">
    <div class="max-w-3xl mx-auto">
        <!-- Location Info -->
        <div class="location-info rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                <span class="mr-2">📍</span>
                当前位置
            </h2>
            <div id="location-status" class="space-y-2">
                <p class="text-gray-600">正在获取位置信息...</p>
                <button onclick="getLocation()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg transition-colors">
                    重新定位
                </button>
            </div>
            <div id="location-info" class="hidden space-y-2">
                <p class="text-gray-800">
                    <span class="font-semibold">地址：</span>
                    <span id="address">正在解析...</span>
                </p>
                <p class="text-gray-600 text-sm">
                    <span>经度：</span><span id="longitude">-</span>
                    <span class="ml-4">纬度：</span><span id="latitude">-</span>
                </p>
            </div>
        </div>

        <!-- Camera Section -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                <span class="mr-2">📸</span>
                拍摄美食照片
            </h2>

            <!-- Camera Preview -->
            <div id="camera-section" class="text-center">
                <video id="camera-preview" autoplay playsinline class="mb-4 mx-auto bg-gray-900"></video>
                <div class="space-x-4">
                    <button onclick="startCamera()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold transition-colors">
                        打开相机
                    </button>
                    <button onclick="capturePhoto()" id="capture-btn" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-lg font-semibold transition-colors hidden">
                        📸 拍照
                    </button>
                </div>
            </div>

            <!-- Captured Image -->
            <div id="image-section" class="hidden text-center">
                <img id="captured-image" alt="Captured food" class="mb-4 mx-auto">
                <canvas id="canvas" class="hidden"></canvas>
                <div class="space-x-4">
                    <button onclick="retakePhoto()" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-lg font-semibold transition-colors">
                        重拍
                    </button>
                    <button onclick="submitCheckin()" class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg font-semibold transition-colors">
                        ✓ 确认打卡
                    </button>
                </div>
            </div>
        </div>

        <!-- Food Selection -->
        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                <span class="mr-2">🍽️</span>
                选择美食类型
            </h2>
            <select id="food-type" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500">
                <option value="">请选择美食类型</option>
                <option value="ramen">拉面 🍜</option>
                <option value="pizza">披萨 🍕</option>
                <option value="sushi">寿司 🍣</option>
                <option value="burger">汉堡 🍔</option>
                <option value="salad">沙拉 🥗</option>
                <option value="coffee">咖啡 ☕</option>
                <option value="dessert">甜点 🍰</option>
                <option value="other">其他</option>
            </select>

            <textarea id="comment" placeholder="分享你的美食体验..." class="w-full mt-4 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500 resize-none" rows="4"></textarea>
        </div>
    </div>
</div>

<script>
    let stream = null;
    let locationData = null;

    // Get user location
    function getLocation() {
        if (navigator.geolocation) {
            document.getElementById('location-status').innerHTML = '<p class="text-gray-600">正在获取位置信息...</p>';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    locationData = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude
                    };

                    document.getElementById('longitude').textContent = locationData.longitude.toFixed(6);
                    document.getElementById('latitude').textContent = locationData.latitude.toFixed(6);
                    document.getElementById('address').textContent = '位置获取成功';

                    document.getElementById('location-status').classList.add('hidden');
                    document.getElementById('location-info').classList.remove('hidden');
                },
                (error) => {
                    document.getElementById('location-status').innerHTML =
                        '<p class="text-red-600">位置获取失败，请检查权限设置</p>' +
                        '<button onclick="getLocation()" class="mt-2 bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg transition-colors">重新定位</button>';
                }
            );
        } else {
            alert('您的浏览器不支持地理定位');
        }
    }

    // Start camera
    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' },
                audio: false
            });

            const video = document.getElementById('camera-preview');
            video.srcObject = stream;
            document.getElementById('capture-btn').classList.remove('hidden');
        } catch (error) {
            alert('无法访问相机，请检查权限设置');
            console.error('Camera error:', error);
        }
    }

    // Capture photo
    function capturePhoto() {
        const video = document.getElementById('camera-preview');
        const canvas = document.getElementById('canvas');
        const image = document.getElementById('captured-image');

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0);

        const imageData = canvas.toDataURL('image/jpeg');
        image.src = imageData;

        // Stop camera
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }

        // Show captured image, hide camera
        document.getElementById('camera-section').classList.add('hidden');
        document.getElementById('image-section').classList.remove('hidden');
    }

    // Retake photo
    function retakePhoto() {
        document.getElementById('camera-section').classList.remove('hidden');
        document.getElementById('image-section').classList.add('hidden');
        startCamera();
    }

    // Submit check-in
    async function submitCheckin() {
        const foodType = document.getElementById('food-type').value;
        const comment = document.getElementById('comment').value;
        const image = document.getElementById('captured-image').src;

        if (!foodType) {
            alert('请选择美食类型');
            return;
        }

        if (!locationData) {
            alert('请先获取位置信息');
            return;
        }

        if (!image || image === '') {
            alert('请先拍摄照片');
            return;
        }

        // Here you would send the data to your backend
        const checkinData = {
            foodType: foodType,
            comment: comment,
            image: image,
            location: locationData,
            timestamp: new Date().toISOString()
        };

        console.log('Check-in data:', checkinData);

        // Show success message
        alert('打卡成功！图鉴已更新');
        window.location.href = '/food-gallery';
    }

    // Initialize location on page load
    window.onload = function() {
        getLocation();
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
