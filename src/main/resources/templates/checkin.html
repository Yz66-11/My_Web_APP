<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打卡解锁 - 美食打卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F97316', 'primary-dark': '#EA580C', 'primary-light': '#FDBA74',
                        accent: '#FBBF24', 'accent-light': '#FDE68A', 'bg-warm': '#FFFAF5',
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="preload" href="/audio/2.m4a" as="audio">
    <script defer src="/js/app.js"></script>
    <style>
        #camera-preview { max-width: 100%; border-radius: 1rem; }
        #captured-image { max-width: 100%; border-radius: 1rem; }
    </style>
</head>
<body class="min-h-screen bg-bg-warm font-sans page-enter">

<!-- Navigation -->
<nav class="nav-glass sticky top-0 z-50">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center h-16">
            <a class="text-xl font-bold text-primary flex items-center gap-2" href="/">
                <span class="gradient-text font-black">美食打卡</span>
            </a>
            <div class="flex items-center gap-4 text-sm">
                <a href="/food-gallery" class="text-stone-500 hover:text-primary transition-colors">图鉴</a>
                <a href="/profile" class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center overflow-hidden ring-2 ring-white shadow-sm shrink-0 hover:ring-primary-light transition-all" title="我的">
                    <img th:if="${avatarUrl != null and !avatarUrl.isEmpty()}" th:src="${avatarUrl}" alt="头像" class="w-full h-full object-cover" referrerpolicy="no-referrer" />
                    <span th:unless="${avatarUrl != null and !avatarUrl.isEmpty()}" class="text-white text-xs font-bold">
                        <span th:text="${username != null and !username.isEmpty() ? #strings.substring(username, 0, 1) : 'U'}">U</span>
                    </span>
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- Page Header -->
<div class="hero-gradient text-white py-10">
    <div class="container mx-auto px-4">
        <div class="flex items-center gap-2 text-white/70 text-sm mb-2">
            <a th:href="@{/food-gallery}" class="hover:text-white transition-colors">图鉴</a>
            <span>/</span>
            <span class="text-white font-medium">打卡解锁</span>
        </div>
        <h1 class="text-3xl font-black mb-1">打卡解锁</h1>
        <p class="text-white/80 text-sm">拍照记录美食，解锁图鉴菜品</p>
    </div>
</div>

<!-- Check-in Content -->
<div class="container mx-auto px-4 py-8">
    <div class="max-w-3xl mx-auto">

        <!-- Dish Info -->
        <div class="card-premium p-6 mb-6 animate-fade-in-up" th:if="${dish != null}">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 bg-gradient-to-br from-orange-100 to-amber-100 rounded-2xl flex items-center justify-center shrink-0">
                    <span class="text-3xl">&#127860;</span>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-stone-800" th:text="${dish.dishName}">菜品名称</h2>
                    <p class="text-sm text-stone-400 mt-0.5" th:if="${shop != null}">
                        <span th:text="${shop.shopName}">店铺名称</span>
                        <span th:if="${city != null}" class="ml-2" th:text="${city + ' ' + district}">地点</span>
                    </p>
                </div>
            </div>
        </div>

        <!-- Hidden fields for JS -->
        <input type="hidden" id="hd-dishId" th:value="${dishId}"/>
        <input type="hidden" id="hd-shopId" th:value="${shopId}"/>
        <input type="hidden" id="hd-city" th:value="${city}"/>
        <input type="hidden" id="hd-district" th:value="${district}"/>

        <!-- Empty state without dish -->
        <div class="card-premium p-6 mb-6 animate-fade-in-up text-center" th:unless="${dish != null}">
            <svg class="w-12 h-12 text-stone-300 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
            <p class="text-stone-500 text-sm">请从图鉴中选择要解锁的菜品</p>
            <a href="/food-gallery" class="btn-primary inline-block mt-3 px-5 py-2 text-sm">前往图鉴</a>
        </div>

        <!-- Camera Section -->
        <div class="card-premium p-6 mb-6 animate-fade-in-up stagger-1">
            <h2 class="text-xl font-bold text-stone-800 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                拍摄美食照片
            </h2>

            <div id="camera-section" class="text-center">
                <video id="camera-preview" autoplay playsinline class="mb-4 mx-auto bg-stone-900 rounded-xl"></video>
                <div id="camera-error-msg" class="text-red-500 text-sm mb-3 hidden"></div>
                <div class="flex justify-center gap-3 flex-wrap">
                    <button onclick="startCamera()" id="start-camera-btn" class="btn-ghost px-6 py-3 font-semibold flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        打开相机
                    </button>
                    <button onclick="document.getElementById('file-input').click()" class="btn-ghost px-6 py-3 font-semibold flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        从相册选择
                    </button>
                    <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFilePick(event)">
                    <button onclick="capturePhoto()" id="capture-btn" class="btn-primary px-6 py-3 font-semibold hidden flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        拍照
                    </button>
                </div>
            </div>

            <div id="image-section" class="hidden text-center">
                <img id="captured-image" alt="Captured food" class="mb-4 mx-auto">
                <canvas id="canvas" class="hidden"></canvas>
                <div class="flex justify-center gap-3">
                    <button onclick="retakePhoto()" class="btn-ghost px-6 py-3 font-semibold flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        重拍
                    </button>
                </div>
            </div>
        </div>

        <!-- Comment Section -->
        <div class="card-premium p-6 mb-6 animate-fade-in-up stagger-2">
            <h2 class="text-xl font-bold text-stone-800 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
                打卡备注
            </h2>
            <textarea id="comment" placeholder="分享你的美食体验..." class="input-warm resize-none" rows="3"></textarea>
        </div>

        <!-- Submit Button -->
        <div class="animate-fade-in-up stagger-3 mb-8">
            <button onclick="submitCheckin()" id="submit-btn"
                    class="btn-primary w-full py-4 text-base font-bold flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                确认打卡并解锁
            </button>
        </div>

    </div>
</div>

<script>
let stream = null;
let capturedImageData = null;

function getDishId() { return document.getElementById('hd-dishId').value; }
function getShopId() { return document.getElementById('hd-shopId').value; }
function getCity() { return document.getElementById('hd-city').value; }
function getDistrict() { return document.getElementById('hd-district').value; }

function showCameraError(msg) {
    var el = document.getElementById('camera-error-msg');
    el.textContent = msg;
    el.classList.remove('hidden');
    document.getElementById('start-camera-btn').disabled = false;
    document.getElementById('start-camera-btn').innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg> 打开相机';
}

async function startCamera() {
    var btn = document.getElementById('start-camera-btn');
    btn.disabled = true;
    btn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> 请求中...';

    document.getElementById('camera-error-msg').classList.add('hidden');

    try {
        // 检查是否在安全上下文（HTTPS / localhost）
        if (window.isSecureContext !== true) {
            showCameraError('相机功能需要 HTTPS 或 localhost 环境才能使用。请检查您的连接方式。');
            return;
        }
        // 检查浏览器是否支持 getUserMedia
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showCameraError('当前浏览器不支持相机功能，请使用最新版 Chrome、Safari 或 Edge 浏览器。');
            return;
        }
        // 先尝试后置摄像头
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        } catch (firstErr) {
            // 后置摄像头不可用（如只有前置摄像头的设备），尝试默认摄像头
            console.warn('后置摄像头不可用，尝试默认摄像头:', firstErr);
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }
        const video = document.getElementById('camera-preview');
        video.srcObject = stream;
        document.getElementById('capture-btn').classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg> 打开相机';
    } catch (error) {
        btn.disabled = false;
        btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg> 打开相机';

        var errMsg = '无法访问相机：';
        if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
            errMsg += '相机权限被拒绝。请在浏览器地址栏左侧点击锁图标或相机图标，将相机权限改为"允许"，然后刷新页面重试。';
        } else if (error.name === 'NotFoundError') {
            errMsg += '未检测到摄像头设备。您可以改用从相册选择图片。';
        } else if (error.name === 'NotReadableError') {
            errMsg += '摄像头被其他应用占用，请关闭其他使用摄像头的程序后重试。';
        } else if (error.name === 'OverconstrainedError') {
            errMsg += '不支持的摄像头参数。请尝试使用从相册选择图片。';
        } else if (error.name === 'AbortError') {
            errMsg += '相机访问被中断，请重试。';
        } else {
            errMsg += error.message || '未知错误';
        }
        showCameraError(errMsg);
        console.error('Camera error:', error);
    }
}

function capturePhoto() {
    const video = document.getElementById('camera-preview');
    const canvas = document.getElementById('canvas');
    const image = document.getElementById('captured-image');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const context = canvas.getContext('2d');
    context.drawImage(video, 0, 0);

    capturedImageData = canvas.toDataURL('image/jpeg');
    image.src = capturedImageData;

    if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }

    document.getElementById('camera-section').classList.add('hidden');
    document.getElementById('image-section').classList.remove('hidden');
}

function retakePhoto() {
    capturedImageData = null;
    document.getElementById('camera-section').classList.remove('hidden');
    document.getElementById('image-section').classList.add('hidden');
}

function handleFilePick(event) {
    var file = event.target.files && event.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function(e) {
        capturedImageData = e.target.result;
        document.getElementById('captured-image').src = capturedImageData;
        document.getElementById('camera-section').classList.add('hidden');
        document.getElementById('image-section').classList.remove('hidden');
    };
    reader.readAsDataURL(file);
    event.target.value = '';
}

async function submitCheckin() {
    const dishIdVal = getDishId();
    if (!dishIdVal) {
        alert('缺少菜品信息，请从图鉴中选择');
        return;
    }
    if (!capturedImageData) {
        alert('请先拍摄美食照片');
        return;
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> 提交中...';

    const data = {
        dishId: dishIdVal ? parseInt(dishIdVal) : null,
        shopId: getShopId() ? parseInt(getShopId()) : null,
        city: getCity(),
        district: getDistrict(),
        comment: document.getElementById('comment').value,
        image: capturedImageData
    };

    try {
        const resp = await fetch('/checkin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await resp.json();
        if (result.success) {
            // 首次解锁（非重复打卡）才播放音效并延迟导航
            if (result.message && result.message.indexOf('打卡成功') >= 0) {
                var targetUrl = (function() {
                    var fromParam = new URLSearchParams(window.location.search).get('from');
                    if (fromParam && fromParam.startsWith('merchant-')) {
                        return '/merchant/' + fromParam.replace('merchant-', '');
                    }
                    var params = new URLSearchParams();
                    if (getShopId()) params.set('shopId', getShopId());
                    if (getCity()) params.set('city', getCity());
                    if (getDistrict()) params.set('district', getDistrict());
                    var qs = params.toString();
                    return '/food-gallery' + (qs ? '?' + qs : '');
                })();
                playSoundAndNavigate('/audio/2.m4a', targetUrl);
            } else {
                // 已解锁过的普通打卡，直接跳转
                var fromParam = new URLSearchParams(window.location.search).get('from');
                if (fromParam && fromParam.startsWith('merchant-')) {
                    window.location.href = '/merchant/' + fromParam.replace('merchant-', '');
                } else {
                    var params = new URLSearchParams();
                    if (getShopId()) params.set('shopId', getShopId());
                    if (getCity()) params.set('city', getCity());
                    if (getDistrict()) params.set('district', getDistrict());
                    var qs = params.toString();
                    window.location.href = '/food-gallery' + (qs ? '?' + qs : '');
                }
            }
        } else {
            alert(result.message);
            btn.disabled = false;
            btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> 确认打卡并解锁';
        }
    } catch (err) {
        alert('提交失败，请稍后重试');
        btn.disabled = false;
        btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> 确认打卡并解锁';
    }
}
</script>
</body>
</html>
