<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的店铺 - 美食打卡</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/js/app.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F97316', 'primary-dark': '#EA580C', 'primary-light': '#FDBA74',
                        accent: '#FBBF24', 'accent-light': '#FDE68A', 'bg-warm': '#FFFAF5',
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-warm page-enter">

<nav class="nav-glass sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
            <a class="text-xl font-bold flex items-center gap-2" href="/">
                <svg class="w-7 h-7 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/></svg>
                <span class="text-primary">美食打卡</span>
            </a>
            <div class="flex items-center gap-1">
                <a href="/" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-primary hover:bg-orange-50 transition-all">首页</a>
                <a href="/profile" class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center overflow-hidden ring-2 ring-white shadow-sm shrink-0 hover:ring-primary-light transition-all" title="我的">
                    <img th:if="${avatarUrl != null and !avatarUrl.isEmpty()}" th:src="${avatarUrl}" alt="头像" class="w-full h-full object-cover" referrerpolicy="no-referrer" />
                    <span th:unless="${avatarUrl != null and !avatarUrl.isEmpty()}" class="text-white text-xs font-bold">
                        <span th:text="${username != null and !username.isEmpty() ? #strings.substring(username, 0, 1) : 'U'}">U</span>
                    </span>
                </a>
            </div>
        </div>
    </div>
</nav>

<div class="relative bg-gradient-to-r from-orange-500 to-amber-500 text-white py-12 overflow-hidden">
    <svg class="absolute inset-0 w-full h-full opacity-10" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.5" fill="white"/></pattern></defs><rect width="100%" height="100%" fill="url(#dots)"/></svg>
    <div class="relative max-w-4xl mx-auto px-4">
        <h1 class="text-3xl font-black mb-1">我的店铺</h1>
        <p class="text-white/90">管理您申请入驻的店铺</p>
    </div>
</div>

<div class="max-w-4xl mx-auto px-4 py-8">

    <!-- Messages -->
    <div th:if="${success}" class="mb-4 bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-xl animate-fade-in-up flex items-center gap-2">
        <svg class="w-5 h-5 text-emerald-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        <span class="text-sm" th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl animate-fade-in-up flex items-center gap-2">
        <svg class="w-5 h-5 text-red-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="text-sm" th:text="${error}"></span>
    </div>

    <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-stone-800">店铺列表</h2>
        <a href="/shop/apply" class="btn-primary px-5 py-2 text-sm inline-flex items-center gap-1.5 btn-press">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            申请新店铺
        </a>
    </div>

    <div th:if="${#lists.isEmpty(shops)}" class="text-center py-20 animate-fade-in">
        <svg class="w-20 h-20 mx-auto mb-5 text-orange-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
        <h3 class="text-xl font-bold text-stone-800 mb-2">暂无店铺</h3>
        <p class="text-stone-500 mb-6">您还没有申请入驻商家</p>
        <a href="/shop/apply" class="btn-primary px-8 py-3 text-sm inline-block btn-press">立即入驻</a>
    </div>

    <div class="space-y-4" th:each="shop, iter : ${shops}">
        <div class="card-premium p-6 animate-fade-in-up dish-card" th:style="${'animation-delay: ' + (iter.index * 0.06) + 's'}">
            <div class="flex items-start justify-between gap-4">
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-2 flex-wrap">
                        <h3 class="text-lg font-bold text-stone-800" th:text="${shop.shopName}">店铺名称</h3>
                        <span th:if="${shop.status.name() == 'PENDING'}" class="badge badge-warning">待审核</span>
                        <span th:if="${shop.status.name() == 'APPROVED'}" class="badge badge-success">已通过</span>
                        <span th:if="${shop.status.name() == 'REJECTED'}" class="badge badge-danger">已拒绝</span>
                        <span th:if="${shop.status.name() == 'WITHDRAW_PENDING'}" class="badge badge-warning">退驻待审</span>
                        <span th:if="${shop.status.name() == 'CLOSED'}" class="badge badge-danger">已闭店</span>
                    </div>
                    <div class="space-y-1.5 text-stone-500 text-sm">
                        <p th:if="${shop.city != null}" class="flex items-center gap-2">
                            <svg class="w-4 h-4 text-orange-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                            <span th:text="${shop.city} + ' ' + ${shop.district}">-</span>
                        </p>
                        <p class="flex items-center gap-2">
                            <svg class="w-4 h-4 text-orange-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <span th:text="${shop.location}">-</span>
                        </p>
                        <p class="flex items-center gap-2">
                            <svg class="w-4 h-4 text-orange-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                            <span th:text="${shop.phone}">-</span>
                        </p>
                        <p class="flex items-center gap-2">
                            <svg class="w-4 h-4 text-orange-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <span th:text="${shop.startTime + ' - ' + shop.endTime}">-</span>
                        </p>
                    </div>
                    <p class="text-stone-500 text-sm mt-2" th:text="${shop.introduction}">-</p>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0 self-center">
                    <a th:if="${shop.status.name() != 'CLOSED'}"
                       th:href="@{/shop/{id}/edit(id=${shop.id})}"
                       class="btn-ghost px-4 py-2 text-xs inline-flex items-center gap-1 btn-press">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        编辑信息
                    </a>
                    <a th:if="${shop.status.name() != 'CLOSED'}"
                       th:href="@{/merchant/{id}/dishes(id=${shop.id})}"
                       class="btn-primary px-4 py-2 text-xs inline-flex items-center gap-1 btn-press">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                        管理菜品
                    </a>
                    <a th:if="${shop.status.name() == 'APPROVED'}"
                       th:href="@{/merchant/{id}(id=${shop.id})}"
                       class="btn-ghost px-4 py-2 text-xs inline-flex items-center gap-1 btn-press">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        查看详情
                    </a>
                    <!-- 退驻申请按钮：仅已通过的店铺可申请 -->
                    <form th:if="${shop.status.name() == 'APPROVED'}"
                          th:action="@{/merchant/{id}/withdraw(id=${shop.id})}" method="post"
                          onsubmit="return confirm('确认申请退驻？退驻后将删除所有菜品，店铺标记为闭店，此操作需管理员审核。')">
                        <button type="submit" class="px-3 py-1.5 text-xs rounded-full text-red-500 border border-red-200 hover:bg-red-50 transition-colors inline-flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                            申请退驻
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
