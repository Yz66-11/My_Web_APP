<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title + ' - 美食打卡'}">帖子详情</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F97316', 'primary-dark': '#EA580C', 'primary-light': '#FDBA74',
                        accent: '#FBBF24', 'accent-light': '#FDE68A', 'bg-warm': '#FFFAF5',
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen">

<!-- Nav -->
<nav class="nav-glass sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4">
        <div class="flex justify-between items-center h-14">
            <a class="flex items-center gap-2 text-xl font-bold text-primary-dark" href="/">
                <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C8.5 2 5 4 5 8c0 2.5 1.5 4 3 5.5V16a1 1 0 001 1h6a1 1 0 001-1v-2.5c1.5-1.5 3-3 3-5.5 0-4-3.5-6-7-6z" fill="url(#nav-grad2)" opacity="0.9"/>
                    <path d="M9 18h6M9 20h4M10 22h2" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round"/>
                    <defs><linearGradient id="nav-grad2" x1="5" y1="2" x2="19" y2="16"><stop stop-color="#FDBA74"/><stop offset="1" stop-color="#F97316"/></linearGradient></defs>
                </svg>
                <span>美食打卡</span>
            </a>
            <a href="/posts" class="text-sm text-stone-400 hover:text-primary transition-colors">&larr; 返回社区</a>
        </div>
    </div>
</nav>

<div class="max-w-3xl mx-auto px-4 py-6">

    <!-- Post Card -->
    <div class="card-premium mb-6 overflow-hidden animate-fade-in-up">
        <!-- Author -->
        <div class="flex items-center justify-between px-5 pt-5 pb-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-orange-400 to-red-400 rounded-full flex items-center justify-center text-white font-bold ring-2 ring-orange-100 shadow-sm"
                     th:text="${post.author == null ? 'U' : (#strings.isEmpty(post.author.name) ? (#strings.isEmpty(post.author.username) ? 'U' : #strings.substring(post.author.username, 0, 1)) : #strings.substring(post.author.name, 0, 1))}">U</div>
                <div>
                    <span class="text-sm font-semibold text-stone-900" th:text="${post.author == null ? '未知用户' : (#strings.isEmpty(post.author.name) ? post.author.username : post.author.name)}">用户</span>
                    <div th:if="${post.createdAt != null}" class="text-xs text-stone-400" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">时间</div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <form th:if="${currentUserId != null and post.author != null and currentUserId == post.author.id}" method="post"
                      th:action="@{/post/{id}/delete(id=${post.id})}"
                      onsubmit="return confirm('确定要删除这篇帖子吗？')">
                    <button type="submit" class="text-xs text-stone-300 hover:text-red-500 transition-colors">删除</button>
                </form>
                <span th:if="${post.status != null and post.status.name() == 'PENDING'}" class="badge badge-warning ml-2">待审核</span>
                <span th:if="${post.status != null and post.status.name() == 'REJECTED'}" class="badge badge-danger ml-2">未通过</span>
            </div>
        </div>

        <!-- Title & Content -->
        <div class="px-5 pb-4">
            <h1 class="text-lg font-bold text-stone-900 mb-3" th:text="${post.title}">标题</h1>
            <div class="text-sm text-stone-600 leading-relaxed whitespace-pre-line" th:text="${post.content}">正文内容</div>
        </div>

        <!-- Images -->
        <div th:if="${post.imageUrls != null and !post.imageUrls.isBlank()}" class="px-5 pb-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                <div th:each="img : ${post.imageUrls.split(',')}" class="aspect-square bg-gradient-to-br from-orange-50 to-orange-100 rounded-xl flex items-center justify-center">
                    <svg class="w-8 h-8 text-orange-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3.75 21h16.5A2.25 2.25 0 0022.5 18.75V5.25A2.25 2.25 0 0020.25 3H3.75A2.25 2.25 0 001.5 5.25v13.5A2.25 2.25 0 003.75 21z"/></svg>
                </div>
            </div>
        </div>

        <!-- Location -->
        <div th:if="${post.location}" class="px-5 pb-4">
            <span class="text-xs text-stone-400 bg-orange-50 px-3 py-1.5 rounded-full inline-flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/></svg>
                <span th:text="${post.location}">地点</span>
            </span>
        </div>

        <!-- Stats -->
        <div class="flex items-center gap-5 sm:gap-6 border-t border-stone-100 px-5 py-3.5 text-sm text-stone-500">
            <form method="post" th:action="@{/post/{id}/like(id=${post.id})}" class="flex items-center gap-1.5 cursor-pointer transition-colors">
                <button type="submit" class="flex items-center gap-1.5 active:scale-90 transition-transform py-1"
                        th:classappend="${liked ? 'text-red-500' : 'hover:text-red-500'}">
                    <svg th:if="${liked}" class="w-6 h-6" fill="#ef4444" viewBox="0 0 24 24"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"/></svg>
                    <svg th:unless="${liked}" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
                    <span th:text="${post.likeCount}">0</span>
                    <span class="hidden sm:inline" th:text="${liked ? '已赞' : '点赞'}">点赞</span>
                </button>
            </form>
            <span class="flex items-center gap-1.5 py-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.444 3 12c0 2.104.859 4.023 2.273 5.48.432.447.74 1.04.586 1.641a4.483 4.483 0 01-.923 1.785A5.969 5.969 0 006 21c1.282 0 2.47-.402 3.445-1.087.81.22 1.668.337 2.555.337z"/></svg>
                <span th:text="${post.commentCount}">0</span>
                <span class="text-xs hidden sm:inline">评论</span>
            </span>
            <form method="post" th:action="@{/post/{id}/favorite(id=${post.id})}" class="flex items-center gap-1.5 cursor-pointer transition-colors">
                <button type="submit" class="flex items-center gap-1.5 active:scale-90 transition-transform py-1"
                        th:classappend="${favorited ? 'text-amber-500' : 'hover:text-amber-500'}">
                    <svg th:if="${favorited}" class="w-6 h-6" fill="#eab308" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z" clip-rule="evenodd"/></svg>
                    <svg th:unless="${favorited}" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg>
                    <span th:text="${post.favoriteCount}">0</span>
                    <span class="hidden sm:inline" th:text="${favorited ? '已收藏' : '收藏'}">收藏</span>
                </button>
            </form>
            <button type="button" th:attr="onclick='sharePost(' + ${post.id} + ')'"
                    class="flex items-center gap-1.5 hover:text-primary transition-colors active:scale-90 py-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z"/></svg>
                <span th:text="${post.shareCount}">0</span>
                <span class="text-xs hidden sm:inline">转发</span>
            </button>
        </div>
    </div>

    <!-- Comment Section -->
    <div class="glass-strong rounded-2xl overflow-hidden animate-fade-in-up stagger-2">
        <div class="px-5 py-4 border-b border-stone-100">
            <h3 class="font-bold text-stone-900">评论 <span class="text-stone-400 font-normal" th:text="'(' + ${#lists.size(comments)} + ')'">(0)</span></h3>
        </div>

        <!-- Comment Input -->
        <form method="post" th:action="@{/post/{id}/comment(id=${post.id})}" class="px-5 py-4 border-b border-stone-100">
            <div class="flex gap-3">
                <input type="text" name="content" required placeholder="写一条评论..." maxlength="500"
                       class="input-warm flex-1 !rounded-full"/>
                <button type="submit" class="btn-primary px-5 py-2 text-sm">
                    发送
                </button>
            </div>
        </form>

        <!-- Comments List -->
        <div th:if="${#lists.isEmpty(comments)}" class="px-5 py-10 text-center text-stone-400 text-sm">
            <svg class="w-10 h-10 mx-auto mb-2 text-stone-300" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.444 3 12c0 2.104.859 4.023 2.273 5.48.432.447.74 1.04.586 1.641a4.483 4.483 0 01-.923 1.785A5.969 5.969 0 006 21c1.282 0 2.47-.402 3.445-1.087.81.22 1.668.337 2.555.337z"/></svg>
            暂无评论，快来抢沙发
        </div>
        <div th:each="c, iter : ${comments}" class="flex gap-3 px-5 py-4 border-b border-stone-50 last:border-b-0 animate-fade-in-up"
             th:style="'animation-delay:' + ${iter.index * 0.05}s">
            <div class="w-8 h-8 bg-gradient-to-br from-blue-400 to-indigo-400 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0 ring-2 ring-indigo-100"
                 th:text="${c.author == null ? 'U' : (#strings.isEmpty(c.author.name) ? (#strings.isEmpty(c.author.username) ? 'U' : #strings.substring(c.author.username, 0, 1)) : #strings.substring(c.author.name, 0, 1))}">U</div>
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-sm font-semibold text-stone-800" th:text="${c.author == null ? '未知用户' : (#strings.isEmpty(c.author.name) ? c.author.username : c.author.name)}">用户</span>
                    <span th:if="${c.createdAt != null}" class="text-xs text-stone-400" th:text="${#temporals.format(c.createdAt, 'MM-dd HH:mm')}">时间</span>
                </div>
                <p class="text-sm text-stone-600" th:text="${c.content}">评论内容</p>
            </div>
            <form th:if="${currentUserId != null and c.author != null and (currentUserId == c.author.id or isAdmin)}"
                  method="post"
                  th:action="@{/admin/comment/{id}/delete(id=${c.id})}"
                  class="shrink-0">
                <input type="hidden" name="page" value="0"/>
                <button type="submit" class="text-xs text-stone-400 hover:text-red-500 transition-colors" onclick="return confirm('确定删除？')">删除</button>
            </form>
        </div>
    </div>
</div>

<script>
function sharePost(postId) {
    fetch('/post/' + postId + '/share', { method: 'POST' })
        .then(() => {
            if (navigator.share) {
                navigator.share({ title: document.title, url: location.href }).catch(() => {});
            } else {
                navigator.clipboard.writeText(location.href).then(() => alert('链接已复制到剪贴板'));
            }
            location.reload();
        });
}
</script>
</body>
</html>
