<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证身份 - 美食打卡</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/js/app.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED', 'primary-dark': '#5B21B6', 'primary-light': '#C4B5FD',
                        accent: '#818CF8', 'accent-light': '#BAE6FD', bg-warm: '#F8F7FF',
                        'warm-50': '#F8F7FF', 'warm-100': '#FFF3E0', 'warm-200': '#FFE0B2',
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="min-h-screen bg-bg-warm relative overflow-hidden page-enter">
    <div class="deco-blob w-72 h-72 bg-orange-300 -top-20 -right-20 animate-float-alt"></div>
    <div class="deco-blob w-80 h-80 bg-violet-200 bottom-10 -left-24 animate-float"></div>
    <div class="deco-blob w-56 h-56 bg-rose-200 top-1/3 right-1/4 animate-float-alt"></div>

    <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md animate-scale-in">
            <div class="text-center mb-8 animate-fade-in-up">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-500 mb-4 shadow-lg shadow-emerald-200/50">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold mb-2 text-stone-800">验证身份</h1>
                <p class="text-stone-500 text-sm">请输入邮箱中收到的 6 位数字验证码</p>
            </div>

            <div class="glass-strong auth-card">
                <div class="px-8 pb-8">
                    <div th:if="${error}" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl">
                        <p class="text-sm" th:text="${error}">验证码无效或已过期</p>
                    </div>

                    <form action="/verify-token" method="POST" class="space-y-5">
                        <div class="space-y-2">
                            <label for="code" class="text-sm font-medium text-stone-600">验证码</label>
                            <input id="code" name="code" type="text" inputmode="numeric" maxlength="6"
                                   placeholder="请输入6位验证码" required
                                   class="input-warm font-mono text-center text-xl tracking-[0.5em]"/>
                        </div>

                        <button type="submit" class="btn-primary w-full py-3 px-4 text-sm">
                            验证并继续
                        </button>

                        <div class="text-center">
                            <a href="/forgot-password" class="text-sm text-stone-400 hover:text-primary transition-colors">重新获取验证码</a>
                            <span class="text-stone-300 mx-2">|</span>
                            <a href="/login" class="text-sm text-stone-400 hover:text-primary transition-colors">返回登录</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

<script>
document.getElementById('code').addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '').slice(0, 6);
});
</script>
</body>
</html>
