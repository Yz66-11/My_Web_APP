<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证码已发送 - 美食打卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F97316', 'primary-dark': '#EA580C', 'primary-light': '#FDBA74',
                        accent: '#FBBF24', 'accent-light': '#FDE68A',
                        'bg-warm': '#FFFAF5',
                        'warm-50': '#FFFAF5', 'warm-100': '#FFF3E0', 'warm-200': '#FFE0B2',
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="min-h-screen bg-warm relative overflow-hidden">
    <!-- Decorative blobs -->
    <div class="deco-blob w-72 h-72 bg-orange-300 -top-20 -left-20 animate-float"></div>
    <div class="deco-blob w-96 h-96 bg-amber-300 -bottom-32 -right-32 animate-float-alt"></div>
    <div class="deco-blob w-64 h-64 bg-rose-200 top-1/2 left-1/3 animate-float"></div>

    <!-- Content -->
    <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md animate-scale-in">
            <!-- Icon Area -->
            <div class="text-center mb-8 animate-fade-in-up">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-500 mb-4 shadow-lg shadow-emerald-200/50">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-stone-800 mb-2">验证码已发送</h1>
                <p class="text-stone-500 text-sm">请查收邮箱并输入验证码</p>
            </div>

            <!-- Email Sent Card -->
            <div class="glass-strong auth-card">
                <div class="p-8 text-center space-y-5">
                    <!-- Email Info -->
                    <div class="bg-warm-100 rounded-2xl p-5">
                        <svg class="w-10 h-10 text-primary mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                        <p class="text-sm text-stone-600">验证码已发送至</p>
                        <p class="text-base font-semibold text-stone-800 mt-1" th:text="${email}">***@***.com</p>
                    </div>

                    <div class="space-y-2">
                        <p class="text-sm text-stone-500">验证码有效期为 <strong class="text-primary">5 分钟</strong>，请尽快完成验证。</p>
                        <p class="text-xs text-stone-400">如未收到邮件，请检查垃圾邮件文件夹</p>
                    </div>

                    <a href="/verify-token"
                       class="btn-primary block w-full py-3 px-4 text-sm text-center">
                        前往输入验证码
                    </a>

                    <a href="/forgot-password" class="btn-ghost block w-full py-3 px-4 text-sm text-center">
                        重新发送验证码
                    </a>

                    <div class="text-center pt-2">
                        <a href="/login" class="text-sm text-stone-400 hover:text-primary transition-colors">返回登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
