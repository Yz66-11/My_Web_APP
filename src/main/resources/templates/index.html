<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>美食评价系统 - 首页</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hero-section {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            min-height: 50vh;
        }
        .feature-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="bg-gray-50">
<!-- Navigation -->
<nav class="bg-white shadow-lg border-b-4 border-orange-500">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-4">
            <a class="text-2xl font-bold text-orange-600 flex items-center" href="/">
                🍽️ 美食评价系统
            </a>
            <div class="flex items-center space-x-4">
                <div th:if="${#authentication.principal != 'anonymousUser'}" class="flex items-center space-x-3">
                    <span class="text-gray-700">欢迎，</span>
                    <span class="font-semibold text-orange-600" th:text="${#authentication.name}"></span>
                    <!-- 管理员徽章 -->
                    <span th:if="${isAdmin}" class="bg-red-100 text-red-700 text-xs font-semibold px-2.5 py-0.5 rounded-full">管理员</span>
                </div>
                <div th:unless="${#authentication.principal != 'anonymousUser'}" class="flex items-center space-x-3">
                    <a class="text-gray-600 hover:text-orange-600 transition-colors font-medium" th:href="@{/login}">登录</a>
                    <a class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg transition-colors" th:href="@{/register}">注册</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Hero Section -->
<div class="hero-section flex items-center justify-center text-white">
    <div class="text-center px-4">
        <h1 class="text-5xl font-bold mb-6">发现美食，记录精彩</h1>
        <p class="text-xl mb-8 max-w-2xl mx-auto">打卡美食，解锁图鉴，分享你的美食之旅</p>
    </div>
</div>

<!-- 普通用户功能入口 -->
<div th:if="${#authentication.principal != 'anonymousUser' and !isAdmin}" class="container mx-auto px-4 py-16">
    <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6 max-w-5xl mx-auto">
        <a href="/merchants" class="feature-card bg-white p-8 rounded-2xl shadow-lg text-center border-2 border-transparent hover:border-orange-500">
            <div class="text-5xl mb-3">🏪</div>
            <h3 class="text-xl font-bold mb-2 text-gray-800">商家列表</h3>
            <p class="text-gray-600 text-sm">探索附近的美食商家</p>
        </a>
        <a href="/food-gallery" class="feature-card bg-white p-8 rounded-2xl shadow-lg text-center border-2 border-transparent hover:border-orange-500">
            <div class="text-5xl mb-3">📖</div>
            <h3 class="text-xl font-bold mb-2 text-gray-800">美食图鉴</h3>
            <p class="text-gray-600 text-sm">收集解锁各种美食</p>
        </a>
        <a href="/posts" class="feature-card bg-white p-8 rounded-2xl shadow-lg text-center border-2 border-transparent hover:border-orange-500">
            <div class="text-5xl mb-3">📝</div>
            <h3 class="text-xl font-bold mb-2 text-gray-800">美食社区</h3>
            <p class="text-gray-600 text-sm">分享美食体验和攻略</p>
        </a>
        <a href="/profile" class="feature-card bg-white p-8 rounded-2xl shadow-lg text-center border-2 border-transparent hover:border-orange-500">
            <div class="text-5xl mb-3">👤</div>
            <h3 class="text-xl font-bold mb-2 text-gray-800">我的</h3>
            <p class="text-gray-600 text-sm">管理个人信息和入驻</p>
        </a>
    </div>
</div>

<!-- 管理员功能入口 -->
<div th:if="${#authentication.principal != 'anonymousUser' and isAdmin}" class="container mx-auto px-4 py-16">
    <div class="max-w-5xl mx-auto">
        <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">管理后台</h2>
        <div class="grid md:grid-cols-2 gap-8">
            <a href="/admin/dashboard" class="feature-card bg-white p-8 rounded-2xl shadow-lg text-center border-2 border-transparent hover:border-red-500">
                <div class="text-6xl mb-4">⚙️</div>
                <h3 class="text-2xl font-bold mb-3 text-gray-800">管理控制台</h3>
                <p class="text-gray-600">管理用户、审核商家入驻、审核评价内容</p>
            </a>
            <a href="/merchants" class="feature-card bg-white p-8 rounded-2xl shadow-lg text-center border-2 border-transparent hover:border-orange-500">
                <div class="text-6xl mb-4">🏪</div>
                <h3 class="text-2xl font-bold mb-3 text-gray-800">商家管理</h3>
                <p class="text-gray-600">查看和管理所有商家、菜品信息</p>
            </a>
        </div>
        <div class="mt-8 text-center">
            <a href="/checkin" class="inline-block bg-orange-500 hover:bg-orange-600 text-white font-semibold px-8 py-3 rounded-lg transition-colors">
                📸 前往打卡
            </a>
            <a href="/food-gallery" class="inline-block bg-blue-500 hover:bg-blue-600 text-white font-semibold px-8 py-3 rounded-lg transition-colors ml-4">
                📖 美食图鉴
            </a>
        </div>
    </div>
</div>

<!-- 未登录引导 -->
<div th:unless="${#authentication.principal != 'anonymousUser'}" class="container mx-auto px-4 py-16 text-center">
    <h2 class="text-3xl font-bold text-gray-800 mb-6">开启你的美食之旅</h2>
    <p class="text-gray-600 mb-8 text-lg">登录或注册，开始探索精彩的美食世界</p>
    <div class="space-x-4">
        <a th:href="@{/login}" class="bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 rounded-lg text-lg font-semibold transition-colors inline-block">立即登录</a>
        <a th:href="@{/register}" class="border-2 border-orange-500 text-orange-500 hover:bg-orange-500 hover:text-white px-8 py-3 rounded-lg text-lg font-semibold transition-colors inline-block">免费注册</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
