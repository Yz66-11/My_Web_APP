<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商家列表 - 美食评价系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .merchant-card { transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; }
        .merchant-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    </style>
</head>
<body class="bg-gray-50">
<!-- Navigation -->
<nav class="bg-white shadow-lg border-b-4 border-orange-500">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-4">
            <a class="text-2xl font-bold text-orange-600 flex items-center" href="/">🍽️ 美食评价系统</a>
            <div class="flex items-center space-x-4">
                <a href="/" class="text-gray-600 hover:text-orange-600 transition-colors">首页</a>
                <a href="/food-gallery" class="text-gray-600 hover:text-orange-600 transition-colors">美食图鉴</a>
                <a href="/profile" class="text-gray-600 hover:text-orange-600 transition-colors">我的</a>
            </div>
        </div>
    </div>
</nav>

<!-- Page Header -->
<div class="bg-gradient-to-r from-orange-500 to-orange-600 text-white py-12">
    <div class="container mx-auto px-4">
        <h1 class="text-4xl font-bold mb-2">商家列表</h1>
        <p class="text-lg opacity-90">发现你身边的美味</p>
    </div>
</div>

<!-- Merchants List -->
<div class="container mx-auto px-4 py-12">
    <div class="mb-8 max-w-2xl mx-auto">
        <form action="/merchants" method="get" class="flex space-x-2">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="搜索商家名称、分类、地址..."
                   class="flex-1 px-6 py-3 rounded-full border-2 border-gray-200 focus:border-orange-500 focus:outline-none">
            <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-full font-medium transition-colors">
                搜索
            </button>
        </form>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div th:each="merchant : ${merchants}" class="merchant-card bg-white rounded-xl shadow-md overflow-hidden">
            <a th:href="@{/merchant/{id}(id=${merchant.id})}" class="block">
                <div class="h-48 bg-gradient-to-br from-orange-400 to-red-500 flex items-center justify-center">
                    <span class="text-6xl">🍜</span>
                </div>
                <div class="p-5">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-lg font-bold text-gray-800" th:text="${merchant.shopName}">商家名称</h3>
                        <span class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full" th:text="${merchant.category}">分类</span>
                    </div>
                    <p class="text-gray-600 text-sm mb-1 flex items-center">
                        <span class="mr-1">📍</span>
                        <span th:text="${merchant.location}">地址</span>
                    </p>
                    <p class="text-gray-600 text-sm flex items-center">
                        <span class="mr-1">📞</span>
                        <span th:text="${merchant.phone}">电话</span>
                    </p>
                </div>
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(merchants)}" class="text-center py-16">
        <div class="text-6xl mb-4">🏪</div>
        <h3 class="text-2xl font-bold text-gray-800 mb-2">暂无商家</h3>
        <p class="text-gray-600">商家列表还在完善中，敬请期待</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
