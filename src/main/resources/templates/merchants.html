<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商家列表 - 美食打卡</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/js/app.js"></script>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#F97316', 'primary-dark': '#EA580C', 'primary-light': '#FDBA74',
            accent: '#FBBF24', 'accent-light': '#FDE68A', 'bg-warm': '#FFFAF5',
          },
          fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] }
        }
      }
    }
    </script>
</head>
<body class="bg-bg-warm page-enter">
<!-- Navigation -->
<nav class="nav-glass sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
        <div class="flex justify-between items-center h-16">
            <a class="text-xl font-bold flex items-center gap-2" href="/">
                <svg class="w-7 h-7 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/>
                </svg>
                <span class="gradient-text">美食打卡</span>
            </a>
            <div class="flex items-center gap-1">
                <a href="/" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-primary hover:bg-orange-50 transition-all">首页</a>
                <a href="/merchants" class="px-3 py-2 rounded-lg text-sm font-bold text-primary bg-orange-50 transition-all">商家</a>
                <a href="/food-gallery" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-primary hover:bg-orange-50 transition-all">图鉴</a>
                <a href="/posts" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-primary hover:bg-orange-50 transition-all">社区</a>
                <a href="/profile" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-primary hover:bg-orange-50 transition-all">我的</a>
            </div>
        </div>
    </div>
</nav>

<!-- Page Header -->
<div class="relative bg-gradient-to-r from-orange-500 to-amber-500 text-white py-16 overflow-hidden">
    <!-- Pattern overlay -->
    <svg class="absolute inset-0 w-full h-full opacity-10" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <pattern id="circlesPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
                <circle cx="20" cy="20" r="8" fill="none" stroke="white" stroke-width="1.5"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#circlesPattern)"/>
    </svg>
    <div class="relative max-w-6xl mx-auto px-4 text-center">
        <h1 class="text-4xl font-black mb-3 drop-shadow-sm">发现美味商家</h1>
        <p class="text-lg text-white/90 font-medium">探索你身边的好味道，开启美食之旅</p>
    </div>
</div>

<!-- Search Bar -->
<div class="max-w-6xl mx-auto px-4 -mt-6 relative z-10 mb-8">
    <div class="max-w-2xl mx-auto">
        <form action="/merchants" method="get" class="flex gap-2 items-center">
            <div class="relative flex-1">
                <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input type="text" name="keyword" th:value="${keyword}" placeholder="搜索商家名称、分类、地址..."
                       class="input-warm !pl-12 !py-3.5 !rounded-full text-sm">
            </div>
            <button type="submit" class="btn-primary px-6 py-3.5 text-sm whitespace-nowrap btn-press">
                <span class="flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    搜索
                </span>
            </button>
        </form>
    </div>
</div>

<!-- Merchants Grid -->
<div class="max-w-6xl mx-auto px-4 pb-16">
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        <a th:each="merchant, iter : ${merchants}"
           th:href="@{/merchant/{id}(id=${merchant.id})}"
           class="card-premium overflow-hidden block animate-fade-in-up dish-card"
           th:style="${'animation-delay:' + (iter.index * 0.06) + 's'}">
            <!-- Image area with warm gradient -->
            <div class="h-48 bg-gradient-to-br from-orange-100 to-amber-200 flex items-center justify-center relative overflow-hidden">
                <!-- Decorative circles -->
                <div class="absolute top-4 right-4 w-16 h-16 rounded-full bg-white/20"></div>
                <div class="absolute bottom-2 left-6 w-10 h-10 rounded-full bg-white/15"></div>
                <svg class="w-16 h-16 text-orange-400/60" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/>
                </svg>
                <!-- Category badge -->
                <span class="absolute top-3 left-3 badge badge-primary" th:text="${merchant.category}">分类</span>
            </div>
            <div class="p-5">
                <h3 class="text-lg font-bold text-gray-800 mb-3" th:text="${merchant.shopName}">商家名称</h3>
                <div class="space-y-2">
                    <p class="text-gray-500 text-sm flex items-center gap-2">
                        <svg class="w-4 h-4 text-orange-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <span th:text="${merchant.location}">地址</span>
                    </p>
                    <p class="text-gray-500 text-sm flex items-center gap-2">
                        <svg class="w-4 h-4 text-orange-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                        </svg>
                        <span th:text="${merchant.phone}">电话</span>
                    </p>
                </div>
            </div>
        </a>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(merchants)}" class="text-center py-20 animate-fade-in">
        <svg class="w-20 h-20 mx-auto mb-5 text-orange-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
        <h3 class="text-2xl font-bold text-gray-800 mb-2">暂无商家</h3>
        <p class="text-gray-500 font-medium">商家列表还在完善中，敬请期待</p>
        <p class="text-gray-500 text-sm mt-1">也许明天就会有新发现哦</p>
    </div>
</div>

</body>
</html>
