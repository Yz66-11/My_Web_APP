<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - 美食打卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F97316', 'primary-dark': '#EA580C', 'primary-light': '#FDBA74',
                        accent: '#FBBF24', 'accent-light': '#FDE68A', 'bg-warm': '#FFFAF5',
                        'warm-50': '#FFFAF5', 'warm-100': '#FFF3E0', 'warm-200': '#FFE0B2',
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="min-h-screen bg-warm relative overflow-hidden">
    <div class="deco-blob w-72 h-72 bg-amber-300 -top-16 -left-16 animate-float"></div>
    <div class="deco-blob w-80 h-80 bg-orange-200 -bottom-24 -right-24 animate-float-alt"></div>
    <div class="deco-blob w-56 h-56 bg-rose-200 top-1/2 right-1/4 animate-float"></div>

    <svg class="absolute inset-0 w-full h-full opacity-[0.03] pointer-events-none" xmlns="http://www.w3.org/2000/svg">
        <defs><pattern id="p" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
            <circle cx="40" cy="40" r="18" fill="none" stroke="#F97316" stroke-width="1.5"/>
            <circle cx="40" cy="40" r="8" fill="none" stroke="#FBBF24" stroke-width="1"/>
        </pattern></defs>
        <rect width="100%" height="100%" fill="url(#p)"/>
    </svg>

    <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md animate-scale-in">
            <div class="text-center mb-8 animate-fade-in-up">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-amber-400 mb-4 shadow-lg shadow-orange-200/50">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold mb-2 text-stone-800">重置密码</h1>
                <p class="text-stone-500 text-sm">请设置您的新密码</p>
            </div>

            <div class="glass-strong auth-card">
                <div class="px-8 pb-8">
                    <div th:if="${param.error}" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl">
                        <p class="text-sm" th:text="${#strings.defaultString(param.error[0], '操作失败，请重试')}">错误消息</p>
                    </div>

                    <form action="/reset-password" method="POST" class="space-y-5" id="resetForm">
                        <div class="space-y-2">
                            <label for="newPassword" class="text-sm font-medium text-stone-600">新密码</label>
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                                <input id="newPassword" name="newPassword" type="password" placeholder="请输入新密码（至少6位）" required minlength="6"
                                       class="input-warm pl-10"/>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label for="confirmPassword" class="text-sm font-medium text-stone-600">确认密码</label>
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                                <input id="confirmPassword" name="confirmPassword" type="password" placeholder="请再次输入新密码" required minlength="6"
                                       class="input-warm pl-10"/>
                            </div>
                            <p id="confirm-hint" class="text-xs mt-1 hidden"></p>
                        </div>

                        <button type="submit" class="btn-primary w-full py-3 px-4 text-sm">
                            重置密码
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

<script>
(function () {
    const pw = document.getElementById('newPassword');
    const cpw = document.getElementById('confirmPassword');
    const hint = document.getElementById('confirm-hint');
    const form = document.getElementById('resetForm');

    function setHint(msg, err) {
        hint.textContent = msg;
        hint.className = 'text-xs mt-1 ' + (err ? 'text-red-500' : 'text-emerald-500');
        hint.classList.remove('hidden');
    }
    function clearHint() {
        hint.textContent = '';
        hint.classList.add('hidden');
        cpw.classList.remove('border-red-400', 'border-emerald-400');
    }

    cpw.addEventListener('input', function () {
        if (!this.value || !pw.value) { clearHint(); return; }
        if (this.value === pw.value) {
            setHint('密码一致', false);
            this.classList.remove('border-red-400');
            this.classList.add('border-emerald-400');
        } else {
            setHint('两次输入的密码不一致', true);
            this.classList.remove('border-emerald-400');
            this.classList.add('border-red-400');
        }
    });

    pw.addEventListener('input', function () {
        if (!cpw.value) return;
        cpw.dispatchEvent(new Event('input'));
    });

    form.addEventListener('submit', function (e) {
        if (pw.value !== cpw.value) {
            e.preventDefault();
            setHint('两次输入的密码不一致，请修正后再提交', true);
            cpw.focus();
        }
    });
})();
</script>
</body>
</html>
