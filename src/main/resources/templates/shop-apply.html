<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家入驻 - 美食打卡</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/js/app.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED', 'primary-dark': '#5B21B6', 'primary-light': '#C4B5FD',
                        accent: '#818CF8', 'accent-light': '#BAE6FD', 'bg-warm': '#F8F7FF',
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-warm">

<nav class="nav-glass sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
            <a class="text-xl font-bold flex items-center gap-2" href="/">
                <svg class="w-7 h-7 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/></svg>
                <span class="text-primary">美食打卡</span>
            </a>
            <a href="/profile" class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center overflow-hidden ring-2 ring-white shadow-sm shrink-0 hover:ring-primary-light transition-all ml-auto" title="我的">
                <img th:if="${avatarUrl != null and !avatarUrl.isEmpty()}" th:src="${avatarUrl}" alt="头像" class="w-full h-full object-cover" referrerpolicy="no-referrer" />
                <span th:unless="${avatarUrl != null and !avatarUrl.isEmpty()}" class="text-white text-xs font-bold">
                    <span th:text="${username != null and !username.isEmpty() ? #strings.substring(username, 0, 1) : 'U'}">U</span>
                </span>
            </a>
        </div>
    </div>
</nav>

<div class="relative bg-gradient-to-r from-indigo-500 to-indigo-500 text-white py-10 overflow-hidden">
    <svg class="absolute inset-0 w-full h-full opacity-10" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.5" fill="white"/></pattern></defs><rect width="100%" height="100%" fill="url(#dots)"/></svg>
    <div class="relative max-w-3xl mx-auto px-4">
        <h1 class="text-3xl font-black mb-1">商家入驻申请</h1>
        <p class="text-white/90 text-sm">填写以下信息，提交后等待管理员审核</p>
    </div>
</div>

<div class="max-w-2xl mx-auto px-4 py-8">
    <!-- Messages -->
    <div th:if="${success}" class="mb-4 bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-xl animate-fade-in-up">
        <p class="text-sm" th:text="${success}"></p>
    </div>
    <div th:if="${error}" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl animate-fade-in-up">
        <p class="text-sm" th:text="${error}"></p>
    </div>

    <div class="card-premium p-6 md:p-8 animate-fade-in-up dish-card">
        <form action="/shop/apply" method="post" class="space-y-5">
            <div>
                <label class="block text-stone-600 font-medium text-sm mb-1.5">店铺名称 <span class="text-red-500">*</span></label>
                <input type="text" name="shopName" required placeholder="请输入店铺名称" class="input-warm"/>
            </div>
            <div>
                <label class="block text-stone-600 font-medium text-sm mb-1.5">店铺分类 <span class="text-red-500">*</span></label>
                <select name="category" required class="input-warm">
                    <option value="">请选择分类</option>
                    <option value="中餐">中餐</option>
                    <option value="日料">日料</option>
                    <option value="韩餐">韩餐</option>
                    <option value="西餐">西餐</option>
                    <option value="火锅">火锅</option>
                    <option value="烧烤">烧烤</option>
                    <option value="甜品饮品">甜品饮品</option>
                    <option value="快餐小吃">快餐小吃</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div>
                <label class="block text-stone-600 font-medium text-sm mb-1.5">所在地区 <span class="text-red-500">*</span></label>
                <div class="grid grid-cols-3 gap-2">
                    <select id="province" required onchange="onProvinceChange()" class="input-warm">
                        <option value="">请选择省</option>
                    </select>
                    <select id="city" required onchange="onCityChange()" class="input-warm">
                        <option value="">请选择市</option>
                    </select>
                    <select id="district" required class="input-warm">
                        <option value="">请选择区</option>
                    </select>
                </div>
                <button type="button" onclick="autoLocate()" id="locate-btn" class="mt-2 text-xs text-primary hover:text-primary-dark inline-flex items-center gap-1 transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    自动定位当前地区
                </button>
            </div>
            <div>
                <label class="block text-stone-600 font-medium text-sm mb-1.5">详细地址 <span class="text-red-500">*</span></label>
                <input type="hidden" name="location" id="location-hidden" required/>
                <input type="hidden" name="city" id="city-hidden"/>
                <input type="hidden" name="district" id="district-hidden"/>
                <input type="text" id="detail-address" required placeholder="街道、门牌号等详细地址" class="input-warm" oninput="syncLocation()"/>
                <p id="region-preview" class="mt-1.5 text-xs text-stone-400 hidden"></p>
            </div>
            <div>
                <label class="block text-stone-600 font-medium text-sm mb-1.5">联系电话 <span class="text-red-500">*</span></label>
                <input type="text" name="phone" required placeholder="请输入联系电话" class="input-warm"/>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-stone-600 font-medium text-sm mb-1.5">营业开始时间</label>
                    <input type="text" name="startTime" placeholder="如: 09:00" class="input-warm"/>
                </div>
                <div>
                    <label class="block text-stone-600 font-medium text-sm mb-1.5">营业结束时间</label>
                    <input type="text" name="endTime" placeholder="如: 22:00" class="input-warm"/>
                </div>
            </div>
            <div>
                <label class="block text-stone-600 font-medium text-sm mb-1.5">店铺简介</label>
                <textarea name="introduction" rows="4" placeholder="请简要介绍您的店铺特色、主打菜品等..." class="input-warm resize-y"></textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="btn-primary flex-1 py-3 text-sm btn-press">提交申请</button>
                <a href="/profile" class="btn-ghost flex-1 py-3 text-sm text-center block btn-press">取消</a>
            </div>
        </form>
    </div>
</div>
<script src="/js/region-data.js"></script>
<script>
const provinceEl = document.getElementById('province');
const cityEl = document.getElementById('city');
const districtEl = document.getElementById('district');
const hiddenLocation = document.getElementById('location-hidden');
const detailInput = document.getElementById('detail-address');
const regionPreview = document.getElementById('region-preview');

// 初始化省份
Object.keys(REGION_DATA).forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    provinceEl.appendChild(opt);
});

function onProvinceChange() {
    const prov = provinceEl.value;
    cityEl.innerHTML = '<option value="">请选择市</option>';
    districtEl.innerHTML = '<option value="">请选择区</option>';
    if (prov && REGION_DATA[prov]) {
        Object.keys(REGION_DATA[prov]).forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            opt.textContent = c;
            cityEl.appendChild(opt);
        });
    }
    syncLocation();
}

function onCityChange() {
    const prov = provinceEl.value;
    const city = cityEl.value;
    districtEl.innerHTML = '<option value="">请选择区</option>';
    if (prov && city && REGION_DATA[prov][city]) {
        REGION_DATA[prov][city].forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            districtEl.appendChild(opt);
        });
    }
    syncLocation();
}

// 监听区变化
districtEl.addEventListener('change', syncLocation);

function getRegionText() {
    const p = provinceEl.value;
    const c = cityEl.value;
    const d = districtEl.value;
    const parts = [p, c, d].filter(v => v);
    return parts.join('');
}

function syncLocation() {
    const region = getRegionText();
    const detail = detailInput.value.trim();
    const full = region + detail;
    hiddenLocation.value = full;
    document.getElementById('city-hidden').value = cityEl.value;
    document.getElementById('district-hidden').value = districtEl.value;

    if (region) {
        regionPreview.textContent = '当前地区：' + region;
        regionPreview.classList.remove('hidden');
    } else {
        regionPreview.classList.add('hidden');
    }
}

function setRegion(province, city, district) {
    provinceEl.value = province;
    onProvinceChange();
    if (city) {
        cityEl.value = city;
        onCityChange();
        if (district) {
            districtEl.value = district;
            syncLocation();
        }
    }
}

// 自动定位（使用浏览器 Geolocation + 高德逆地理编码免费接口）
function autoLocate() {
    const btn = document.getElementById('locate-btn');
    btn.innerHTML = '<svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> 定位中...';
    btn.disabled = true;

    if (!navigator.geolocation) {
        alert('您的浏览器不支持定位功能');
        resetLocateBtn();
        return;
    }

    navigator.geolocation.getCurrentPosition(
        pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            // 使用高德地图 Web API 逆地理编码（免费，无需 key）
            fetch('https://restapi.amap.com/v3/geocode/regeo?key=a5c98b6acd681c5be08c4ae90ee5de2f&location=' + lng + ',' + lat)
                .then(r => r.json())
                .then(data => {
                    if (data.status === '1' && data.regeocode) {
                        const comp = data.regeocode.addressComponent;
                        const prov = comp.province;
                        const city = comp.city || comp.province; // 直辖市 city 为空
                        const dist = comp.district;
                        if (REGION_DATA[prov]) {
                            setRegion(prov, city, dist);
                        } else {
                            alert('未能匹配到对应的行政区划，请手动选择');
                        }
                    } else {
                        alert('定位解析失败，请手动选择地区');
                    }
                    resetLocateBtn();
                })
                .catch(() => {
                    alert('网络请求失败，请手动选择地区');
                    resetLocateBtn();
                });
        },
        () => {
            alert('定位失败，请允许浏览器获取位置权限后重试');
            resetLocateBtn();
        },
        { timeout: 10000, enableHighAccuracy: true }
    );
}

function resetLocateBtn() {
    const btn = document.getElementById('locate-btn');
    btn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg> 自动定位当前地区';
    btn.disabled = false;
}

// 表单提交前验证
document.querySelector('form').addEventListener('submit', function(e) {
    if (!provinceEl.value || !cityEl.value || !districtEl.value) {
        e.preventDefault();
        alert('请选择完整的省、市、区');
    }
});
</script>

</body>
</html>
