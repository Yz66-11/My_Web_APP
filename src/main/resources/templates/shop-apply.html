<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家入驻 - 美食评价系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<!-- Navigation -->
<nav class="bg-white shadow-lg border-b-4 border-orange-500">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-4">
            <a class="text-2xl font-bold text-orange-600 flex items-center" href="/">
                🍽️ 美食评价系统
            </a>
            <div class="flex items-center space-x-4">
                <a href="/" class="text-gray-600 hover:text-orange-600 transition-colors">首页</a>
                <a href="/profile" class="text-gray-600 hover:text-orange-600 transition-colors">我的</a>
            </div>
        </div>
    </div>
</nav>

<!-- Header -->
<div class="bg-gradient-to-r from-orange-500 to-red-500 text-white py-12">
    <div class="container mx-auto px-4">
        <h1 class="text-4xl font-bold mb-2">商家入驻申请</h1>
        <p class="text-lg opacity-90">填写以下信息，提交后等待管理员审核</p>
    </div>
</div>

<!-- Messages -->
<div th:if="${success}" class="container mx-auto px-4 mt-6">
    <div class="max-w-2xl mx-auto bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg">
        <span th:text="${success}"></span>
    </div>
</div>
<div th:if="${error}" class="container mx-auto px-4 mt-6">
    <div class="max-w-2xl mx-auto bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg">
        <span th:text="${error}"></span>
    </div>
</div>

<div class="container mx-auto px-4 py-12">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-xl shadow-md p-8">
            <form action="/shop/apply" method="post" class="space-y-5">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">店铺名称 <span class="text-red-500">*</span></label>
                    <input type="text" name="shopName" required placeholder="请输入店铺名称"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">店铺分类 <span class="text-red-500">*</span></label>
                    <select name="category" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500">
                        <option value="">请选择分类</option>
                        <option value="中餐">中餐</option>
                        <option value="日料">日料</option>
                        <option value="韩餐">韩餐</option>
                        <option value="西餐">西餐</option>
                        <option value="火锅">火锅</option>
                        <option value="烧烤">烧烤</option>
                        <option value="甜品饮品">甜品饮品</option>
                        <option value="快餐小吃">快餐小吃</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">店铺地址 <span class="text-red-500">*</span></label>
                    <input type="text" name="location" required placeholder="请输入店铺详细地址"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">联系电话 <span class="text-red-500">*</span></label>
                    <input type="text" name="phone" required placeholder="请输入联系电话"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">营业开始时间</label>
                        <input type="text" name="startTime" placeholder="如: 09:00"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">营业结束时间</label>
                        <input type="text" name="endTime" placeholder="如: 22:00"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">店铺简介</label>
                    <textarea name="introduction" rows="4" placeholder="请简要介绍您的店铺特色、主打菜品等..."
                              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500"></textarea>
                </div>
                <div class="flex space-x-4 pt-4">
                    <button type="submit" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-lg transition-colors text-lg">
                        提交申请
                    </button>
                    <a href="/profile" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-3 rounded-lg transition-colors text-lg text-center block">
                        取消
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
