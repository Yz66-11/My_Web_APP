<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家入驻 - 美食打卡</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#F97316', 'primary-dark': '#EA580C', accent: '#FBBF24', 'bg-warm': '#FFFAF5' }, fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] } }}
        }
    </script>
</head>
<body class="bg-warm">

<nav class="nav-glass sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
            <a class="text-xl font-bold flex items-center gap-2" href="/">
                <svg class="w-7 h-7 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/></svg>
                <span class="text-primary">美食打卡</span>
            </a>
            <a href="/profile" class="text-sm text-stone-400 hover:text-primary transition-colors flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                返回
            </a>
        </div>
    </div>
</nav>

<div class="relative bg-gradient-to-r from-orange-500 to-amber-500 text-white py-10 overflow-hidden">
    <svg class="absolute inset-0 w-full h-full opacity-10" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.5" fill="white"/></pattern></defs><rect width="100%" height="100%" fill="url(#dots)"/></svg>
    <div class="relative max-w-3xl mx-auto px-4">
        <h1 class="text-3xl font-black mb-1">商家入驻申请</h1>
        <p class="text-white/90 text-sm">填写以下信息，提交后等待管理员审核</p>
    </div>
</div>

<div class="max-w-2xl mx-auto px-4 py-8">
    <!-- Messages -->
    <div th:if="${success}" class="mb-4 bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-xl animate-fade-in-up">
        <p class="text-sm" th:text="${success}"></p>
    </div>
    <div th:if="${error}" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl animate-fade-in-up">
        <p class="text-sm" th:text="${error}"></p>
    </div>

    <div class="card-premium p-6 md:p-8 animate-fade-in-up">
        <form action="/shop/apply" method="post" class="space-y-5">
            <div>
                <label class="block text-stone-600 font-medium text-sm mb-1.5">店铺名称 <span class="text-red-500">*</span></label>
                <input type="text" name="shopName" required placeholder="请输入店铺名称" class="input-warm"/>
            </div>
            <div>
                <label class="block text-stone-600 font-medium text-sm mb-1.5">店铺分类 <span class="text-red-500">*</span></label>
                <select name="category" required class="input-warm">
                    <option value="">请选择分类</option>
                    <option value="中餐">中餐</option>
                    <option value="日料">日料</option>
                    <option value="韩餐">韩餐</option>
                    <option value="西餐">西餐</option>
                    <option value="火锅">火锅</option>
                    <option value="烧烤">烧烤</option>
                    <option value="甜品饮品">甜品饮品</option>
                    <option value="快餐小吃">快餐小吃</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div>
                <label class="block text-stone-600 font-medium text-sm mb-1.5">店铺地址 <span class="text-red-500">*</span></label>
                <input type="text" name="location" required placeholder="请输入店铺详细地址" class="input-warm"/>
            </div>
            <div>
                <label class="block text-stone-600 font-medium text-sm mb-1.5">联系电话 <span class="text-red-500">*</span></label>
                <input type="text" name="phone" required placeholder="请输入联系电话" class="input-warm"/>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-stone-600 font-medium text-sm mb-1.5">营业开始时间</label>
                    <input type="text" name="startTime" placeholder="如: 09:00" class="input-warm"/>
                </div>
                <div>
                    <label class="block text-stone-600 font-medium text-sm mb-1.5">营业结束时间</label>
                    <input type="text" name="endTime" placeholder="如: 22:00" class="input-warm"/>
                </div>
            </div>
            <div>
                <label class="block text-stone-600 font-medium text-sm mb-1.5">店铺简介</label>
                <textarea name="introduction" rows="4" placeholder="请简要介绍您的店铺特色、主打菜品等..." class="input-warm resize-y"></textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="btn-primary flex-1 py-3 text-sm">提交申请</button>
                <a href="/profile" class="btn-ghost flex-1 py-3 text-sm text-center block">取消</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
