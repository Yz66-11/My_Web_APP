<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 美食评价系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .stat-card { transition: transform 0.2s ease; }
        .stat-card:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="bg-gray-100">
<!-- 顶部导航 -->
<nav class="bg-white shadow-lg border-b-4 border-red-500">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-3">
            <div class="flex items-center space-x-3">
                <a class="text-xl font-bold text-red-600 flex items-center" href="/admin/dashboard">⚙️ 管理后台</a>
                <span class="text-gray-400">|</span>
                <a class="text-gray-500 hover:text-orange-600 transition-colors text-sm" href="/">返回前台</a>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-gray-600">管理员：<strong th:text="${#authentication.name}"></strong></span>
                <form action="/logout" method="post">
                    <button type="submit" class="text-red-500 hover:text-red-700 transition-colors text-sm font-medium">退出登录</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container mx-auto px-4 py-8">
    <!-- 消息提示 -->
    <div th:if="${success}" class="mb-6 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg">
        <span th:text="${success}"></span>
    </div>

    <!-- 统计卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="stat-card bg-white rounded-xl shadow-md p-6 border-l-4 border-blue-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm">用户总数</p>
                    <h2 class="text-3xl font-bold text-gray-800 mt-1" th:text="${totalUsers}">0</h2>
                </div>
                <div class="text-4xl">👥</div>
            </div>
        </div>
        <div class="stat-card bg-white rounded-xl shadow-md p-6 border-l-4 border-green-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm">已通过商家</p>
                    <h2 class="text-3xl font-bold text-gray-800 mt-1" th:text="${approvedShopCount}">0</h2>
                </div>
                <div class="text-4xl">🏪</div>
            </div>
        </div>
        <div class="stat-card bg-white rounded-xl shadow-md p-6 border-l-4 border-yellow-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm">待审核商家</p>
                    <h2 class="text-3xl font-bold text-gray-800 mt-1" th:text="${pendingShopCount}">0</h2>
                </div>
                <div class="text-4xl">⏳</div>
            </div>
        </div>
        <div class="stat-card bg-white rounded-xl shadow-md p-6 border-l-4 border-orange-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm">待审核评价</p>
                    <h2 class="text-3xl font-bold text-gray-800 mt-1">0</h2>
                </div>
                <div class="text-4xl">⭐</div>
            </div>
        </div>
    </div>

    <!-- 商家审核 -->
    <div class="bg-white rounded-xl shadow-md mb-8">
        <div class="p-6 border-b border-gray-200">
            <h2 class="text-xl font-bold text-gray-800">商家入驻审核</h2>
            <p class="text-gray-500 text-sm mt-1">审核商家入驻申请，通过或拒绝</p>
        </div>
        <div class="p-6">
            <div th:if="${#lists.isEmpty(pendingShops)}" class="text-center py-8 text-gray-400">
                暂无待审核的商家入驻申请
            </div>
            <div class="space-y-4" th:each="shop : ${pendingShops}">
                <div class="border border-gray-200 rounded-lg p-5 hover:bg-gray-50 transition-colors">
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <h3 class="text-lg font-bold text-gray-800 mb-2" th:text="${shop.shopName}">店铺名称</h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm text-gray-600">
                                <p><span class="font-medium">分类：</span><span th:text="${shop.category}">-</span></p>
                                <p><span class="font-medium">地址：</span><span th:text="${shop.location}">-</span></p>
                                <p><span class="font-medium">电话：</span><span th:text="${shop.phone}">-</span></p>
                                <p><span class="font-medium">时间：</span><span th:text="${shop.startTime + ' - ' + shop.endTime}">-</span></p>
                            </div>
                            <p class="text-sm text-gray-500 mt-2" th:if="${shop.introduction != null}">
                                <span class="font-medium">简介：</span><span th:text="${shop.introduction}">-</span>
                            </p>
                            <p class="text-xs text-gray-400 mt-2">
                                申请人：<span th:text="${shop.owner.username}">-</span>
                                &nbsp;|&nbsp; 申请时间：<span th:text="${#temporals.format(shop.createdAt, 'yyyy-MM-dd HH:mm')}">-</span>
                            </p>
                        </div>
                        <div class="flex space-x-2 ml-4 flex-shrink-0">
                            <form th:action="@{/admin/shops/{id}/approve(id=${shop.id})}" method="post"
                                  onsubmit="return confirm('确认通过该商家入驻申请？')">
                                <button type="submit" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                    通过
                                </button>
                            </form>
                            <form th:action="@{/admin/shops/{id}/reject(id=${shop.id})}" method="post"
                                  onsubmit="return confirm('确认拒绝该商家入驻申请？')">
                                <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                    拒绝
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 用户管理 -->
    <div class="bg-white rounded-xl shadow-md">
        <div class="p-6 border-b border-gray-200">
            <h2 class="text-xl font-bold text-gray-800">用户管理</h2>
            <p class="text-gray-500 text-sm mt-1">管理系统中的所有用户</p>
        </div>
        <div class="p-6">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-50">
                            <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase">ID</th>
                            <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase">用户名</th>
                            <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase">邮箱</th>
                            <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase">昵称</th>
                            <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase">角色</th>
                            <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr th:each="user : ${users}" class="hover:bg-gray-50">
                            <td class="px-4 py-3 text-sm text-gray-600" th:text="${user.id}">1</td>
                            <td class="px-4 py-3">
                                <div class="flex items-center">
                                    <div class="w-7 h-7 bg-orange-100 rounded-full flex items-center justify-center text-xs font-bold text-orange-600 mr-2"
                                         th:text="${#strings.substring(user.username, 0, 1)}">U</div>
                                    <span class="font-medium text-gray-800" th:text="${user.username}">username</span>
                                </div>
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-600" th:text="${user.email}">email</td>
                            <td class="px-4 py-3 text-sm text-gray-600" th:text="${user.name ?: '-'}">-</td>
                            <td class="px-4 py-3">
                                <span th:if="${user.role.name() == 'ADMIN'}"
                                      class="bg-red-100 text-red-700 text-xs font-semibold px-2.5 py-0.5 rounded-full">管理员</span>
                                <span th:unless="${user.role.name() == 'ADMIN'}"
                                      class="bg-blue-100 text-blue-700 text-xs font-semibold px-2.5 py-0.5 rounded-full">普通用户</span>
                            </td>
                            <td class="px-4 py-3 text-sm space-x-2">
                                <form th:action="@{/admin/users/{id}/toggle-role(id=${user.id})}" method="post"
                                      onsubmit="return confirm('确认切换该用户角色？')">
                                    <button type="submit" class="bg-yellow-100 text-yellow-700 hover:bg-yellow-200 px-3 py-1 rounded-md text-xs font-medium">切换角色</button>
                                </form>
                                <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post"
                                      onsubmit="return confirm('确认删除该用户？')"
                                      th:if="${user.username != #authentication.name}">
                                    <button type="submit" class="bg-red-100 text-red-700 hover:bg-red-200 px-3 py-1 rounded-md text-xs font-medium">删除</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6" class="px-4 py-8 text-center text-gray-400">暂无用户数据</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
