<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${shop.shopName} + ' - 商家详情'">商家详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .product-card { transition: transform 0.3s ease; }
        .product-card:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-gray-50">
<!-- Navigation -->
<nav class="bg-white shadow-lg border-b-4 border-orange-500">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-4">
            <a class="text-2xl font-bold text-orange-600 flex items-center" href="/">🍽️ 美食评价系统</a>
            <div class="flex items-center space-x-4">
                <a href="/" class="text-gray-600 hover:text-orange-600 transition-colors">首页</a>
                <a href="/merchants" class="text-gray-600 hover:text-orange-600 transition-colors">商家列表</a>
                <a href="/profile" class="text-gray-600 hover:text-orange-600 transition-colors">我的</a>
            </div>
        </div>
    </div>
</nav>

<!-- Shop Header -->
<div class="bg-gradient-to-r from-orange-500 to-red-500 text-white py-12">
    <div class="container mx-auto px-4">
        <div class="flex items-start justify-between">
            <div class="flex-1">
                <h1 class="text-4xl font-bold mb-4" th:text="${shop.shopName}">商家名称</h1>
                <div class="space-y-2 text-lg">
                    <p class="flex items-center">
                        <span class="mr-2">📍</span>
                        <span th:text="${shop.location}">地址</span>
                    </p>
                    <p class="flex items-center">
                        <span class="mr-2">📞</span>
                        <span th:text="${shop.phone}">电话</span>
                    </p>
                    <p class="flex items-center" th:if="${shop.startTime != null and shop.endTime != null}">
                        <span class="mr-2">🕐</span>
                        <span th:text="${shop.startTime + ' - ' + shop.endTime}">营业时间</span>
                    </p>
                    <p class="flex items-center" th:if="${shop.category != null}">
                        <span class="mr-2">🏷️</span>
                        <span th:text="${shop.category}">分类</span>
                    </p>
                </div>
            </div>
            <a href="/checkin" class="bg-white text-orange-600 hover:bg-orange-50 px-6 py-3 rounded-lg font-semibold transition-colors flex-shrink-0">
                📸 打卡
            </a>
        </div>
    </div>
</div>

<!-- Dishes Section -->
<div class="container mx-auto px-4 py-12">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">菜品列表</h2>
    <div class="grid md:grid-cols-3 lg:grid-cols-4 gap-6">
        <div th:each="dish : ${dishes}" class="product-card bg-white rounded-xl shadow-md overflow-hidden">
            <div class="h-40 bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center">
                <span class="text-5xl">🍽️</span>
            </div>
            <div class="p-4">
                <h3 class="font-bold text-lg text-gray-800 mb-2" th:text="${dish.dishName}">菜品名称</h3>
                <p class="text-gray-600 text-sm mb-3 line-clamp-2" th:text="${dish.description}">描述</p>
                <div class="flex justify-between items-center">
                    <span class="text-orange-600 font-bold text-xl" th:text="'¥' + ${dish.price}">¥28</span>
                    <span th:if="${dish.status.name() == 'AVAILABLE'}" class="text-green-600 text-xs">上架中</span>
                    <span th:unless="${dish.status.name() == 'AVAILABLE'}" class="text-gray-400 text-xs">已下架</span>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(dishes)}" class="text-center py-16">
        <div class="text-6xl mb-4">🍽️</div>
        <h3 class="text-2xl font-bold text-gray-800 mb-2">暂无菜品</h3>
        <p class="text-gray-600">该商家还未添加菜品信息</p>
    </div>
</div>

<!-- Shop Introduction -->
<div th:if="${shop.introduction != null and !shop.introduction.isEmpty()}" class="container mx-auto px-4 pb-12">
    <div class="bg-white rounded-xl shadow-md p-8">
        <h2 class="text-xl font-bold text-gray-800 mb-4">商家简介</h2>
        <p class="text-gray-700 leading-relaxed" th:text="${shop.introduction}">商家介绍...</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
