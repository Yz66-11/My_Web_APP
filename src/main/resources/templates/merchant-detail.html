<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${shop.shopName} + ' - 商家详情'">商家详情</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/js/app.js"></script>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#F97316', 'primary-dark': '#EA580C', 'primary-light': '#FDBA74',
            accent: '#FBBF24', 'accent-light': '#FDE68A', 'bg-warm': '#FFFAF5',
          },
          fontFamily: { sans: ['Noto Sans SC', 'sans-serif'] }
        }
      }
    }
    </script>
</head>
<body class="bg-bg-warm page-enter">
<!-- Navigation -->
<nav class="nav-glass sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
        <div class="flex justify-between items-center h-16">
            <a class="text-xl font-bold flex items-center gap-2" href="/">
                <svg class="w-7 h-7 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/>
                </svg>
                <span class="gradient-text">美食打卡</span>
            </a>
            <div class="flex items-center gap-1">
                <a href="/" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-primary hover:bg-orange-50 transition-all">首页</a>
                <a href="/merchants" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-primary hover:bg-orange-50 transition-all">商家</a>
                <a href="/food-gallery" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-primary hover:bg-orange-50 transition-all">图鉴</a>
                <a href="/profile" class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center overflow-hidden ring-2 ring-white shadow-sm shrink-0 hover:ring-primary-light transition-all" title="我的">
                    <img th:if="${avatarUrl != null and !avatarUrl.isEmpty()}" th:src="${avatarUrl}" alt="头像" class="w-full h-full object-cover" referrerpolicy="no-referrer" />
                    <span th:unless="${avatarUrl != null and !avatarUrl.isEmpty()}" class="text-white text-xs font-bold">
                        <span th:text="${username != null and !username.isEmpty() ? #strings.substring(username, 0, 1) : 'U'}">U</span>
                    </span>
                </a>
                <button onclick="toggleCart()" class="relative ml-1 w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:text-primary hover:bg-orange-50 transition-all">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
                    <span id="cart-badge" class="hidden absolute -top-0.5 -right-0.5 w-5 h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- Shop Header -->
<div class="relative hero-gradient text-white overflow-hidden" style="padding: 3rem 0;">
    <!-- Decorative pattern -->
    <svg class="absolute inset-0 w-full h-full opacity-10" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <pattern id="detailDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                <circle cx="10" cy="10" r="1.5" fill="white"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#detailDots)"/>
    </svg>
    <div class="relative max-w-6xl mx-auto px-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="flex-1">
                <h1 class="text-3xl sm:text-4xl font-black mb-4 drop-shadow-sm" th:text="${shop.shopName}">商家名称</h1>
                <div class="space-y-2.5 text-white/90">
                    <p class="flex items-center gap-2 text-sm sm:text-base">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <span th:text="${shop.location}">地址</span>
                    </p>
                    <p class="flex items-center gap-2 text-sm sm:text-base">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                        </svg>
                        <span th:text="${shop.phone}">电话</span>
                    </p>
                    <p class="flex items-center gap-2 text-sm sm:text-base" th:if="${shop.startTime != null and shop.endTime != null}">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span th:text="${shop.startTime + ' - ' + shop.endTime}">营业时间</span>
                    </p>
                    <p class="flex items-center gap-2 text-sm sm:text-base" th:if="${shop.category != null}">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
                        </svg>
                        <span th:text="${shop.category}">分类</span>
                    </p>
                </div>
            </div>
            <div class="flex flex-col items-end gap-2 shrink-0">
                <button onclick="shopCheckin()" id="shop-checkin-btn"
                        class="btn-primary px-6 py-3 text-sm inline-flex items-center gap-2 btn-press">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                    <span id="checkin-btn-text">打卡</span>
                </button>
                <div th:if="${daysSinceFirstVisit != null}" class="text-white/80 text-xs flex items-center gap-1 animate-fade-in">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    距你第一次来已过 <span class="font-bold text-white" th:text="${daysSinceFirstVisit}">0</span> 天
                </div>
                <div th:if="${totalVisits != null}" class="text-white/60 text-xs">
                    <span th:text="${totalVisits}">0</span> 人打卡过
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Dishes Section -->
<div class="max-w-6xl mx-auto px-4 py-12">
    <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2 animate-fade-in-up">
        <svg class="w-6 h-6 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/>
        </svg>
        菜品列表
    </h2>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
        <div th:each="dish, iter : ${dishes}" class="card-premium overflow-hidden animate-fade-in-up dish-card" th:style="${'animation-delay:' + (iter.index * 0.05) + 's'}">
            <!-- Dish image area -->
            <div class="h-40 bg-gradient-to-br from-amber-100 to-orange-200 flex items-center justify-center relative overflow-hidden">
                <div class="absolute top-3 right-3 w-10 h-10 rounded-full bg-white/20"></div>
                <svg class="w-14 h-14 text-orange-400/50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/>
                </svg>
                <!-- Status badge -->
                <span th:if="${dish.status.name() == 'AVAILABLE'}" class="absolute top-3 left-3 badge badge-success">上架中</span>
                <span th:unless="${dish.status.name() == 'AVAILABLE'}" class="absolute top-3 left-3 badge" style="background:rgba(168,162,158,0.15);color:#78716C;">已下架</span>
            </div>
            <div class="p-4">
                <h3 class="font-bold text-base text-gray-800 mb-1.5" th:text="${dish.dishName}">菜品名称</h3>
                <p class="text-gray-500 text-xs mb-3 line-clamp-2 leading-relaxed" th:text="${dish.description}">描述</p>
                <div class="flex items-center justify-between gap-2" th:if="${dish.status.name() == 'AVAILABLE'}">
                    <span class="text-primary font-black text-lg" th:text="'¥' + ${dish.price}">¥28</span>
                    <div class="flex items-center gap-2">
                        <!-- 已解锁：显示已打卡 -->
                        <span th:if="${#lists.contains(unlockedDishIds, dish.id)}"
                              class="text-xs text-stone-400 font-medium flex items-center gap-0.5 px-2.5 py-1.5 rounded-full border border-stone-200 bg-stone-50">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                            已打卡
                        </span>
                        <!-- 未解锁：显示打卡解锁按钮 -->
                        <a th:unless="${#lists.contains(unlockedDishIds, dish.id)}"
                           th:href="@{/checkin(dishId=${dish.id}, shopId=${shop.id}, from=${'merchant-' + shop.id})}"
                           class="text-xs text-emerald-600 hover:text-emerald-700 font-medium flex items-center gap-0.5 px-2.5 py-1.5 rounded-full border border-emerald-200 hover:bg-emerald-50 transition-all">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            打卡解锁
                        </a>
                        <button th:attr="data-id=${dish.id}, data-name=${dish.dishName}, data-price=${dish.price}"
                                onclick="addToCart(this)" class="w-9 h-9 rounded-full bg-gradient-to-r from-orange-500 to-amber-500 text-white flex items-center justify-center shadow-md hover:shadow-lg hover:scale-110 active:scale-95 transition-all">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                        </button>
                    </div>
                </div>
                <div class="flex items-center justify-between" th:unless="${dish.status.name() == 'AVAILABLE'}">
                    <span class="text-stone-400 font-bold text-lg" th:text="'¥' + ${dish.price}">¥28</span>
                    <span class="text-stone-400 text-xs">已下架</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty State for dishes -->
    <div th:if="${#lists.isEmpty(dishes)}" class="text-center py-20 animate-fade-in">
        <svg class="w-20 h-20 mx-auto mb-5 text-orange-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/>
        </svg>
        <h3 class="text-2xl font-bold text-gray-800 mb-2">暂无菜品</h3>
        <p class="text-gray-500 font-medium">该商家还未添加菜品信息</p>
        <p class="text-gray-400 text-sm mt-1">敬请期待更多美味</p>
    </div>
</div>

<!-- Shop Introduction -->
<div th:if="${shop.introduction != null and !shop.introduction.isEmpty()}" class="max-w-6xl mx-auto px-4 pb-12">
    <div class="card-premium p-8 animate-fade-in-up dish-card">
        <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
            <svg class="w-5 h-5 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            商家简介
        </h2>
        <p class="text-gray-600 leading-relaxed text-sm" th:text="${shop.introduction}">商家介绍...</p>
    </div>
</div>

<!-- Cart Sidebar Overlay -->
<div id="cart-overlay" class="fixed inset-0 bg-black/40 z-[60] hidden opacity-0 transition-opacity duration-300" onclick="toggleCart()"></div>

<!-- Cart Sidebar -->
<div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full max-w-md bg-white z-[70] shadow-2xl translate-x-full transition-transform duration-300 flex flex-col">
    <!-- Cart Header -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-stone-100">
        <h2 class="text-lg font-bold text-stone-800 flex items-center gap-2">
            <svg class="w-6 h-6 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
            购物车
        </h2>
        <button onclick="toggleCart()" class="w-9 h-9 rounded-full hover:bg-stone-100 flex items-center justify-center text-stone-400 hover:text-stone-600 transition-all">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <!-- Cart Items -->
    <div id="cart-items" class="flex-1 overflow-y-auto px-6 py-4">
        <!-- Empty state -->
        <div id="cart-empty" class="flex flex-col items-center justify-center h-full text-center">
            <svg class="w-20 h-20 text-stone-200 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
            <p class="text-stone-400 font-medium">购物车是空的</p>
            <p class="text-stone-300 text-sm mt-1">快去选购心仪的菜品吧</p>
        </div>
    </div>

    <!-- Cart Footer -->
    <div id="cart-footer" class="hidden border-t border-stone-100 px-6 py-5 bg-stone-50/50">
        <div class="flex items-center justify-between mb-4">
            <span class="text-stone-500 text-sm">合计</span>
            <span class="text-2xl font-black text-primary" id="cart-total">¥0.00</span>
        </div>
        <button onclick="clearCart()" class="w-full btn-ghost py-3 text-sm mb-2">清空购物车</button>
        <button onclick="submitOrder()" class="w-full btn-primary py-3 text-sm">提交订单</button>
    </div>
</div>

<script>
// Shop checkin
async function shopCheckin() {
    const btn = document.getElementById('shop-checkin-btn');
    const text = document.getElementById('checkin-btn-text');
    btn.disabled = true;
    text.textContent = '打卡中...';
    try {
        const resp = await fetch('/merchant/' + [[${shop.id}]] + '/checkin', { method: 'POST' });
        const result = await resp.json();
        if (result.success) {
            text.textContent = '已打卡';
            btn.classList.remove('btn-primary');
            btn.classList.add(...['bg-emerald-500', 'hover:bg-emerald-600', 'btn-press']);
            btn.style.background = '';
            showToast('success', '打卡成功！记录你的美食足迹');
        } else {
            alert(result.message);
            text.textContent = '打卡';
            btn.disabled = false;
        }
    } catch (e) {
        alert('打卡失败，请稍后重试');
        text.textContent = '打卡';
        btn.disabled = false;
    }
}
// Check if already checked in (disable button)
document.addEventListener('DOMContentLoaded', function() {
    if ([[${daysSinceFirstVisit != null ? true : false}]]) {
        const btn = document.getElementById('shop-checkin-btn');
        const text = document.getElementById('checkin-btn-text');
        text.textContent = '已打卡';
        btn.classList.remove('btn-primary');
        btn.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
        btn.style.background = '';
    }
});

const CART_KEY = 'cart_' + [[${shop.id}]];
let cart = JSON.parse(localStorage.getItem(CART_KEY) || '{}');

function saveCart() {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    updateCartUI();
}

function addToCart(btn) {
    const id = btn.dataset.id;
    const name = btn.dataset.name;
    const price = parseFloat(btn.dataset.price);
    if (!cart[id]) {
        cart[id] = { id, name, price, qty: 0 };
    }
    cart[id].qty++;
    saveCart();
    // button animation
    btn.classList.add('scale-90');
    setTimeout(() => btn.classList.remove('scale-90'), 150);
}

function changeQty(id, delta) {
    if (!cart[id]) return;
    cart[id].qty += delta;
    if (cart[id].qty <= 0) delete cart[id];
    saveCart();
}

function removeFromCart(id) {
    delete cart[id];
    saveCart();
}

function clearCart() {
    cart = {};
    saveCart();
}

function updateCartUI() {
    const badge = document.getElementById('cart-badge');
    const itemsEl = document.getElementById('cart-items');
    const emptyEl = document.getElementById('cart-empty');
    const footerEl = document.getElementById('cart-footer');
    const totalEl = document.getElementById('cart-total');

    const entries = Object.values(cart);
    const count = entries.reduce((s, i) => s + i.qty, 0);
    const total = entries.reduce((s, i) => s + i.price * i.qty, 0);

    // badge
    if (count > 0) {
        badge.textContent = count > 99 ? '99+' : count;
        badge.classList.remove('hidden');
    } else {
        badge.classList.add('hidden');
    }

    // items
    if (entries.length === 0) {
        emptyEl.classList.remove('hidden');
        footerEl.classList.add('hidden');
        // remove old item elements
        itemsEl.querySelectorAll('.cart-item').forEach(el => el.remove());
        return;
    }

    emptyEl.classList.add('hidden');
    footerEl.classList.remove('hidden');
    totalEl.textContent = '¥' + total.toFixed(2);

    // rebuild items
    itemsEl.querySelectorAll('.cart-item').forEach(el => el.remove());
    entries.forEach(item => {
        const div = document.createElement('div');
        div.className = 'cart-item flex items-center gap-4 py-4 border-b border-stone-50 last:border-0';
        div.innerHTML = `
            <div class="flex-1 min-w-0">
                <h4 class="font-semibold text-stone-800 text-sm truncate">${item.name}</h4>
                <p class="text-primary font-bold text-sm mt-0.5">¥${item.price.toFixed(2)}</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="changeQty('${item.id}', -1)" class="w-8 h-8 rounded-full border border-stone-200 flex items-center justify-center text-stone-500 hover:border-primary hover:text-primary hover:bg-orange-50 transition-all active:scale-90">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"/></svg>
                </button>
                <span class="w-6 text-center font-bold text-stone-800 text-sm">${item.qty}</span>
                <button onclick="changeQty('${item.id}', 1)" class="w-8 h-8 rounded-full border border-stone-200 flex items-center justify-center text-stone-500 hover:border-primary hover:text-primary hover:bg-orange-50 transition-all active:scale-90">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                </button>
            </div>
            <div class="text-right">
                <span class="text-stone-800 font-bold text-sm">¥${(item.price * item.qty).toFixed(2)}</span>
                <button onclick="removeFromCart('${item.id}')" class="block text-stone-300 hover:text-red-500 transition-colors mt-1">
                    <svg class="w-4 h-4 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
            </div>
        `;
        itemsEl.appendChild(div);
    });
}

function toggleCart() {
    const sidebar = document.getElementById('cart-sidebar');
    const overlay = document.getElementById('cart-overlay');
    const isOpen = !sidebar.classList.contains('translate-x-full');
    if (isOpen) {
        sidebar.classList.add('translate-x-full');
        overlay.classList.add('opacity-0');
        setTimeout(() => overlay.classList.add('hidden'), 300);
    } else {
        overlay.classList.remove('hidden');
        requestAnimationFrame(() => {
            overlay.classList.remove('opacity-0');
            sidebar.classList.remove('translate-x-full');
        });
    }
}

function submitOrder() {
    const entries = Object.values(cart);
    if (entries.length === 0) return;
    const total = entries.reduce((s, i) => s + i.price * i.qty, 0);
    const items = entries.map(i => i.name + ' x' + i.qty).join('、');
    if (confirm('确认下单？\n\n' + items + '\n\n合计：¥' + total.toFixed(2))) {
        clearCart();
        toggleCart();
    }
}

// Toast helper
function showToast(type, msg) {
    const toast = document.createElement('div');
    toast.className = 'toast mb-2';
    const colors = { success: 'bg-emerald-50 border-emerald-200 text-emerald-700', error: 'bg-red-50 border-red-200 text-red-700' };
    toast.innerHTML = '<div class="' + (colors[type] || colors.success) + ' px-5 py-3 rounded-xl shadow-lg flex items-center gap-2">' +
        '<span>' + msg + '</span></div>';
    document.querySelector('.toast-container')?.remove();
    const container = document.createElement('div');
    container.className = 'toast-container';
    container.appendChild(toast);
    document.body.appendChild(container);
    setTimeout(function() { toast.classList.add('toast-out'); setTimeout(function() { toast.remove(); container.remove(); }, 300); }, 3000);
}
// init
updateCartUI();
</script>
